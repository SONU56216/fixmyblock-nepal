<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - FixMyBlock Nepal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-container { width: 100%; max-width: 420px; }
        .login-box {
            background: #fff;
            border-radius: 24px;
            padding: 36px 28px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
        }
        .login-box .login-header { margin-bottom: 24px; }
        .login-box .login-header i { font-size: 48px; color: #1a73e8; margin-bottom: 8px; }
        .login-box .login-header h2 { font-size: 24px; margin-bottom: 4px; }
        .login-box .login-header .subtitle { color: #5f6b7a; font-size: 14px; }
        .login-box .login-form { text-align: left; }
        .login-box .login-form .form-group { margin-bottom: 16px; }
        .login-box .login-form .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; color: #555; }
        .login-box .login-form .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e4ea;
            border-radius: 8px;
            font-size: 15px;
            transition: border 0.2s;
        }
        .login-box .login-form .form-group input:focus { outline: none; border-color: #1a73e8; }
        .login-box .error-msg {
            color: #ea4335;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            background: #fce4ec;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .login-box .error-msg i { margin-right: 6px; }
        .form-hint {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            background: #1a73e8;
            color: #fff;
        }
        .btn:hover { background: #1557b0; }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .login-footer { margin-top: 16px; text-align: center; }
        .login-footer a { color: #1a73e8; text-decoration: none; font-size: 13px; }
        .login-footer a:hover { text-decoration: underline; }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .security-note {
            font-size: 12px;
            color: #888;
            margin-top: 12px;
            background: #f8f9fc;
            padding: 8px 12px;
            border-radius: 8px;
            text-align: center;
        }
        .security-note i { margin-right: 4px; color: #1a73e8; }
        .lock-icon {
            position: absolute;
            top: -20px;
            right: -10px;
            background: #ea4335;
            color: #fff;
            border-radius: 50%;
            padding: 8px 10px;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(234,67,53,0.3);
        }
        /* ===== SIMPLE BACKGROUND – CLEAR PHOTO ===== */
body {
    background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTf9wMS1VZNluak-Y2e9pHdYvTevRfEHYj4CJi7tdvIgQ&s=10') no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', system-ui, sans-serif;
}

/* No overlay – image visible */

.login-box {
    background: rgba(255, 255, 255, 0.85);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    border-radius: 24px;
    padding: 36px 28px;
    max-width: 420px;
    width: 90%;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.3);
}

.login-box .login-header h2,
.login-box .login-header .subtitle,
.login-box .form-group label,
.login-box .demo-cred,
.login-box .login-footer a {
    color: #1a1a2e !important;
}

.login-box .form-group input {
    background: rgba(255, 255, 255, 0.7) !important;
    border: 1px solid rgba(0, 0, 0, 0.1) !important;
    color: #1a1a2e !important;
}

.login-box .form-group input:focus {
    border-color: #1a73e8 !important;
    background: #fff !important;
}

.login-box .btn {
    background: #1a73e8 !important;
    color: #fff !important;
    border: none;
}

.login-box .btn:hover {
    background: #1557b0 !important;
}
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <!-- Security badge -->
            <div class="lock-icon"><i class="fas fa-lock"></i></div>

            <div class="login-header">
                <i class="fas fa-shield-halved"></i>
                <h2>Admin Access</h2>
                <p class="subtitle">Secure login for authorized officials</p>
            </div>

            <div class="login-form">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" />
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" />
                </div>

                <!-- Extra Security: Secret Code (optional) -->
                <div class="form-group">
                    <label><i class="fas fa-shield-alt"></i> Security Code</label>
                    <input type="password" id="securityCode" placeholder="Enter security code (4 digits)" maxlength="4" />
                    <div class="form-hint">Contact admin for the code</div>
                </div>

                <div class="error-msg" id="loginError">
                    <i class="fas fa-exclamation-circle"></i> Invalid credentials. Please try again.
                </div>

                <button class="btn" id="loginBtn">
                    <i class="fas fa-arrow-right-to-bracket"></i> Login
                </button>

                <div class="security-note">
                    <i class="fas fa-shield-alt"></i> This login is protected with additional verification.
                </div>

                <div class="login-footer">
                    <a href="index.html"><i class="fas fa-arrow-left"></i> Back to App</a>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // ================================================================
        // 🔴🔴🔴 STEP 1: PASTE YOUR FIREBASE CONFIG HERE 🔴🔴🔴
        // ================================================================

        const firebaseConfig = {
            apiKey: "AIzaSyBVvWlYUCOfALhtWdR53_ZcP5spTYhDyu8",
  authDomain: "fixmyblock-nepal.firebaseapp.com",
  projectId: "fixmyblock-nepal",
  storageBucket: "fixmyblock-nepal.firebasestorage.app",
  messagingSenderId: "742804276117",
  appId: "1:742804276117:web:ddab9eeff9a357c1112c9c",
  measurementId: "G-C3RQER0PC1"
        };

        // ================================================================
        // 🔴 STEP 2: SET YOUR SECRET SECURITY CODE (CHANGE THIS!)
        // ================================================================

        const SECRET_CODE = '1234'; // Admin only – change this!

        // ================================================================
        // 🔴 STEP 3: DO NOT CHANGE ANYTHING BELOW THIS LINE
        // ================================================================

        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
        import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        console.log('✅ Firebase Auth initialized!');

        // ================================================================
        //  DOM REFS
        // ================================================================

        const emailInput = document.getElementById('loginEmail');
        const passwordInput = document.getElementById('loginPassword');
        const codeInput = document.getElementById('securityCode');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('loginError');

        // Rate limiting: block after 5 failed attempts
        let failedAttempts = 0;
        const MAX_ATTEMPTS = 5;
        let blockTime = 0;

        // ================================================================
        //  CHECK IF ALREADY LOGGED IN
        // ================================================================

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const adminDoc = await getDoc(doc(db, 'admins', user.uid));
                    if (adminDoc.exists() && adminDoc.data().role === 'admin') {
                        console.log('✅ Admin already logged in, redirecting...');
                        window.location.href = 'admin.html';
                    } else {
                        await signOut(auth);
                    }
                } catch (e) {
                    console.error('Error checking admin:', e);
                }
            }
        });

        // ================================================================
        //  LOGIN FUNCTION (with security code & rate limiting)
        // ================================================================

        async function handleLogin() {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const code = codeInput.value.trim();

            // Check rate limit
            if (failedAttempts >= MAX_ATTEMPTS) {
                if (Date.now() - blockTime < 60000) { // 1 minute block
                    errorMsg.style.display = 'block';
                    errorMsg.textContent = 'Too many failed attempts. Please wait 1 minute.';
                    return;
                } else {
                    failedAttempts = 0; // Reset after timeout
                }
            }

            // Validate fields
            if (!email || !password || !code) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'All fields are required.';
                return;
            }

            // Validate security code
            if (code !== SECRET_CODE) {
                failedAttempts++;
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Invalid security code. Attempts: ' + failedAttempts + '/' + MAX_ATTEMPTS;
                if (failedAttempts >= MAX_ATTEMPTS) {
                    blockTime = Date.now();
                }
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';
            errorMsg.style.display = 'none';

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Check admin status
                const adminDoc = await getDoc(doc(db, 'admins', user.uid));
                if (!adminDoc.exists() || adminDoc.data().role !== 'admin') {
                    errorMsg.style.display = 'block';
                    errorMsg.textContent = 'You are not authorized as an admin.';
                    await signOut(auth);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Login';
                    return;
                }

                // Success
                console.log('✅ Admin verified! Redirecting...');
                failedAttempts = 0; // Reset on success
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 500);

            } catch (error) {
                console.error('Login error:', error);
                let userMessage = error.message;
                if (error.code === 'auth/user-not-found') {
                    userMessage = 'No account found with this email.';
                } else if (error.code === 'auth/wrong-password') {
                    userMessage = 'Incorrect password.';
                } else if (error.code === 'auth/too-many-requests') {
                    userMessage = 'Too many failed attempts. Please wait.';
                }
                errorMsg.style.display = 'block';
                errorMsg.textContent = userMessage;
                failedAttempts++;
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Login';
            }
        }

        // ================================================================
        //  EVENT LISTENERS
        // ================================================================

        loginBtn.addEventListener('click', handleLogin);

        // Allow Enter key on any field
        [emailInput, passwordInput, codeInput].forEach(input => {
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') handleLogin();
            });
        });

        console.log('🔐 FixMyBlock Nepal - Secure Admin Login Loaded');
        console.log('💡 Security code required (set in the code)');
    </script>

</body>
</html>
