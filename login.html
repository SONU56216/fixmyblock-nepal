<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - FixMyBlock Nepal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-container { width: 100%; max-width: 420px; }
        .login-box {
            background: #fff;
            border-radius: 24px;
            padding: 36px 28px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-box .login-header { margin-bottom: 24px; }
        .login-box .login-header i { font-size: 48px; color: #1a73e8; margin-bottom: 8px; }
        .login-box .login-header h2 { font-size: 24px; margin-bottom: 4px; }
        .login-box .login-header .subtitle { color: #5f6b7a; font-size: 14px; }
        .login-box .login-form { text-align: left; }
        .login-box .login-form .form-group { margin-bottom: 16px; }
        .login-box .login-form .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; color: #555; }
        .login-box .login-form .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e0e4ea;
            border-radius: 8px;
            font-size: 15px;
            transition: border 0.2s;
        }
        .login-box .login-form .form-group input:focus { outline: none; border-color: #1a73e8; }
        .login-box .error-msg {
            color: #ea4335;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            background: #fce4ec;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .login-box .error-msg i { margin-right: 6px; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            background: #1a73e8;
            color: #fff;
        }
        .btn:hover { background: #1557b0; }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .demo-cred {
            font-size: 12px;
            color: #888;
            margin-top: 16px;
            background: #f8f9fc;
            padding: 10px 14px;
            border-radius: 8px;
            text-align: center;
        }
        .demo-cred strong { color: #1a1a2e; }
        .login-footer { margin-top: 16px; text-align: center; }
        .login-footer a { color: #1a73e8; text-decoration: none; font-size: 13px; }
        .login-footer a:hover { text-decoration: underline; }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <i class="fas fa-shield-halved"></i>
                <h2>Admin Access</h2>
                <p class="subtitle">Secure login for municipality officials</p>
            </div>

            <div class="login-form">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <input type="email" id="loginEmail" placeholder="admin@fixmyblock.gov.np" />
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password" />
                </div>

                <div class="error-msg" id="loginError">
                    <i class="fas fa-exclamation-circle"></i> Invalid credentials. Please try again.
                </div>

                <button class="btn" id="loginBtn">
                    <i class="fas fa-arrow-right-to-bracket"></i> Login
                </button>

                <div class="demo-cred">
                    <strong>Demo Credentials:</strong><br />
                    Email: admin@fixmyblock.gov.np<br />
                    Password: admin123
                </div>

                <div class="login-footer">
                    <a href="index.html"><i class="fas fa-arrow-left"></i> Back to App</a>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // ================================================================
        // 🔴🔴🔴 STEP 1: PASTE YOUR FIREBASE CONFIG HERE 🔴🔴🔴
        // ================================================================

        const firebaseConfig = {
            apiKey: "AIzaSyBVvWlYUCOfALhtWdR53_ZcP5spTYhDyu8",
  authDomain: "fixmyblock-nepal.firebaseapp.com",
  projectId: "fixmyblock-nepal",
  storageBucket: "fixmyblock-nepal.firebasestorage.app",
  messagingSenderId: "742804276117",
  appId: "1:742804276117:web:ddab9eeff9a357c1112c9c",
  measurementId: "G-C3RQER0PC1"
        };

        // ================================================================
        // 🔴 STEP 2: DO NOT CHANGE ANYTHING BELOW THIS LINE
        // ================================================================

        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
        import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        console.log('✅ Firebase Auth initialized!');

        // ================================================================
        //  DOM REFS
        // ================================================================

        const emailInput = document.getElementById('loginEmail');
        const passwordInput = document.getElementById('loginPassword');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('loginError');

        // ================================================================
        //  CHECK IF ALREADY LOGGED IN
        // ================================================================

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                console.log('🔐 User already logged in:', user.email);
                try {
                    const adminDoc = await getDoc(doc(db, 'admins', user.uid));
                    if (adminDoc.exists() && adminDoc.data().role === 'admin') {
                        console.log('✅ User is admin, redirecting to admin.html');
                        window.location.href = 'admin.html';
                    } else {
                        console.log('❌ User is not admin, logging out...');
                        await signOut(auth);
                    }
                } catch (e) {
                    console.error('Error checking admin:', e);
                }
            } else {
                console.log('🔐 No user logged in, showing login form');
                // Auto-fill demo credentials
                emailInput.value = 'admin@fixmyblock.gov.np';
                passwordInput.value = 'admin123';
            }
        });

        // ================================================================
        //  LOGIN FUNCTION
        // ================================================================

        async function handleLogin() {
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();

            if (!email || !password) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Please enter both email and password.';
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';
            errorMsg.style.display = 'none';

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                console.log('✅ Login successful:', user.email);

                // Check if admin
                const adminDoc = await getDoc(doc(db, 'admins', user.uid));
                if (!adminDoc.exists() || adminDoc.data().role !== 'admin') {
                    errorMsg.style.display = 'block';
                    errorMsg.textContent = 'You are not authorized as an admin.';
                    await signOut(auth);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Login';
                    return;
                }

                // Success - redirect to admin
                console.log('✅ Admin verified, redirecting...');
                window.location.href = 'admin.html';

            } catch (error) {
                console.error('Login error:', error);
                errorMsg.style.display = 'block';
                errorMsg.textContent = error.message || 'Invalid credentials. Please try again.';
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Login';
            }
        }

        // ================================================================
        //  EVENT LISTENERS
        // ================================================================

        loginBtn.addEventListener('click', handleLogin);

        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleLogin();
        });

        emailInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') handleLogin();
        });

        console.log('🔐 FixMyBlock Nepal - Admin Login Page Loaded');
    </script>

</body>
</html>
