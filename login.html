<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login - FixMyBlock Nepal</title>

    <!-- ===== PWA CONFIG ===== -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png" />

    <!-- ===== FONTS & ICONS ===== -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- ===== STYLES ===== -->
    <style>
        /* ================================================================
           FIXMYBLOCK NEPAL – ADMIN LOGIN PAGE
           Modern Theme with Glassmorphism & Nepal Colors
           ================================================================ */

        /* ----- CSS Variables ----- */
        :root {
            --primary: #1a73e8;
            --primary-dark: #0d47a1;
            --primary-light: #e8f0fe;
            --secondary: #dc143c;
            --success: #34a853;
            --danger: #ea4335;
            --gray: #5f6b7a;
            --gray-light: #f0f2f5;
            --gray-border: #e8ecf2;
            --card-bg: #ffffff;
            --bg: #f8f9fc;
            --text: #1a1a2e;
            --text-muted: #6b7280;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.1);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* ----- Dark Theme ----- */
        body.dark-theme {
            --card-bg: #1e1e2e;
            --bg: #121212;
            --text: #e0e0e0;
            --gray-light: #1a1a2a;
            --gray-border: #2a2a3e;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        /* ----- Base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
            line-height: 1.6;
        }

        /* ----- Glass Background ----- */
        body.has-glass-bg {
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTf9wMS1VZNluak-Y2e9pHdYvTevRfEHYj4CJi7tdvIgQ&s=10');
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }

        body.has-glass-bg::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        body.dark-theme.has-glass-bg::before {
            background: rgba(0, 0, 0, 0.65);
        }

        /* ----- Login Container ----- */
        .login-container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
        }

        /* ----- Login Box ----- */
        .login-box {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 36px 28px;
            box-shadow: var(--shadow);
            border: 1px solid var(--gray-border);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        body.has-glass-bg .login-box {
            background: rgba(255, 255, 255, 0.88);
            -webkit-backdrop-filter: blur(16px);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        body.dark-theme.has-glass-bg .login-box {
            background: rgba(0, 0, 0, 0.7);
        }

        .login-box:hover {
            box-shadow: var(--shadow-hover);
        }

        /* ----- Security Badge ----- */
        .login-box .security-badge {
            position: absolute;
            top: -10px;
            right: -10px;
            background: var(--secondary);
            color: #fff;
            border-radius: 50%;
            padding: 8px 10px;
            font-size: 14px;
            box-shadow: 0 4px 12px rgba(220, 20, 60, 0.3);
            z-index: 5;
        }

        /* ----- Login Header ----- */
        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .login-header .lock-icon {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 8px;
            display: inline-block;
        }

        .login-header h2 {
            font-size: 24px;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 2px;
        }

        .login-header .subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* ----- Form ----- */
        .login-form {
            text-align: left;
        }

        /* ----- Form Groups ----- */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 13px;
            color: var(--text);
            margin-bottom: 4px;
        }

        .form-group label i {
            margin-right: 4px;
            color: var(--primary);
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--gray-border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-family: inherit;
            transition: var(--transition);
            background: var(--gray-light);
            color: var(--text);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--card-bg);
            box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.1);
        }

        .form-group input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        /* ----- Security Code Hint ----- */
        .code-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .code-hint i {
            margin-right: 4px;
            color: var(--primary);
        }

        /* ----- Error Message ----- */
        .error-msg {
            color: var(--danger);
            font-size: 13px;
            margin-top: 8px;
            padding: 8px 12px;
            background: #fce4ec;
            border-radius: 6px;
            display: none;
        }

        .error-msg i {
            margin-right: 6px;
        }

        body.dark-theme .error-msg {
            background: #3a1a1a;
        }

        /* ----- Login Button ----- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition);
            width: 100%;
            font-family: inherit;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            box-shadow: 0 4px 16px rgba(26, 115, 232, 0.3);
            margin-top: 4px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(26, 115, 232, 0.4);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ----- Spinner ----- */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ----- Footer Links ----- */
        .login-footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--gray-border);
        }

        .login-footer a {
            color: var(--primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
        }

        .login-footer a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .login-footer a i {
            margin-right: 4px;
        }

        /* ================================================================
           RESPONSIVE
           ================================================================ */

        /* ----- Mobile Phones ----- */
        @media (max-width: 480px) {
            .login-box {
                padding: 28px 18px;
                border-radius: var(--radius-sm);
            }

            .login-header h2 {
                font-size: 20px;
            }

            .login-header .lock-icon {
                font-size: 40px;
            }

            .form-group input {
                padding: 10px 12px;
                font-size: 14px;
            }

            .btn {
                padding: 12px 20px;
                font-size: 15px;
            }
        }

        /* ----- Very Small Phones ----- */
        @media (max-width: 360px) {
            .login-box {
                padding: 20px 14px;
            }

            .login-header h2 {
                font-size: 18px;
            }

            .login-header .lock-icon {
                font-size: 36px;
            }

            .form-group input {
                padding: 8px 10px;
                font-size: 13px;
            }

            .btn {
                padding: 10px 16px;
                font-size: 14px;
            }
        }

        /* ----- Landscape Mode ----- */
        @media (orientation: landscape) and (max-height: 500px) {
            body {
                padding: 10px;
                align-items: flex-start;
                padding-top: 20px;
            }

            .login-box {
                padding: 16px 20px;
            }

            .login-header {
                margin-bottom: 12px;
            }

            .login-header .lock-icon {
                font-size: 28px;
                margin-bottom: 2px;
            }

            .login-header h2 {
                font-size: 18px;
            }

            .form-group {
                margin-bottom: 8px;
            }

            .form-group input {
                padding: 6px 10px;
                font-size: 13px;
            }

            .btn {
                padding: 8px 14px;
                font-size: 14px;
                margin-top: 0;
            }

            .login-footer {
                margin-top: 10px;
                padding-top: 10px;
            }
        }

        /* ----- Print ----- */
        @media print {
            body {
                background: #fff !important;
            }
            .login-box {
                box-shadow: none !important;
                border: 1px solid #ddd !important;
            }
            .btn {
                display: none !important;
            }
        }
    </style>
</head>

<body class="has-glass-bg">

    <!-- ===== LOGIN CONTAINER ===== -->
    <div class="login-container">

        <!-- ===== LOGIN BOX ===== -->
        <div class="login-box">

            <!-- Security Badge -->
            <div class="security-badge">
                <i class="fas fa-lock"></i>
            </div>

            <!-- Header -->
            <div class="login-header">
                <div class="lock-icon">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <h2>Admin Access</h2>
                <p class="subtitle">Secure login for authorized officials</p>
            </div>

            <!-- Form -->
            <form class="login-form" id="loginForm" autocomplete="off">

                <!-- Email -->
                <div class="form-group">
                    <label for="loginEmail">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="username"
                    value="admin@fixmyblock.gov.np"
                    />
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="loginPassword">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    value="admin123"
                    />
                </div>

                <!-- Security Code -->
                <div class="form-group">
                    <label for="securityCode">
                        <i class="fas fa-shield-alt"></i> Security Code
                    </label>
                    <input
                    type="password"
                    id="securityCode"
                    placeholder="Enter 4-digit code"
                    maxlength="4"
                    autocomplete="off"
                    value="1234"
                    />
                    <div class="code-hint">
                        <i class="fas fa-info-circle"></i>
                        Contact the administrator for the security code
                    </div>
                </div>

                <!-- Error Message -->
                <div class="error-msg" id="loginError">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText">Invalid credentials. Please try again.</span>
                </div>

                <!-- Login Button -->
                <button type="submit" class="btn" id="loginBtn">
                    <i class="fas fa-arrow-right-to-bracket"></i>
                    Login
                </button>

            </form>

            <!-- Footer -->
            <div class="login-footer">
                <a href="index.html">
                    <i class="fas fa-arrow-left"></i> Back to App
                </a>
            </div>

        </div>
    </div>

    <!-- ============================================================ -->
    <!-- ===== JAVASCRIPT ===== -->
    <!-- ============================================================ -->

    <script type="module">
        // ================================================================
        // 🔴🔴🔴 STEP 1: PASTE YOUR FIREBASE CONFIG HERE
        // ================================================================

        const firebaseConfig = {
            apiKey: "AIzaSyBVvWlYUCOfALhtWdR53_ZcP5spTYhDyu8",
  authDomain: "fixmyblock-nepal.firebaseapp.com",
  projectId: "fixmyblock-nepal",
  storageBucket: "fixmyblock-nepal.firebasestorage.app",
  messagingSenderId: "742804276117",
  appId: "1:742804276117:web:ddab9eeff9a357c1112c9c",
  measurementId: "G-C3RQER0PC1"
        };

        // ================================================================
        // 🔴🔴🔴 STEP 2: SET YOUR SECRET SECURITY CODE (CHANGE THIS!)
        // ================================================================

        const SECRET_CODE = '1234'; // Change this to your own code

        // ================================================================
        // 🔴 STEP 3: DO NOT CHANGE ANYTHING BELOW THIS LINE
        // ================================================================

        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import {
            getAuth,
            signInWithEmailAndPassword,
            onAuthStateChanged,
            signOut
        } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
        import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

        // ================================================================
        // INIT FIREBASE
        // ================================================================

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        console.log('✅ Firebase Auth initialized!');

        // ================================================================
        // DOM REFS
        // ================================================================

        const emailInput = document.getElementById('loginEmail');
        const passwordInput = document.getElementById('loginPassword');
        const codeInput = document.getElementById('securityCode');
        const loginBtn = document.getElementById('loginBtn');
        const errorMsg = document.getElementById('loginError');
        const errorText = document.getElementById('errorText');

        // ================================================================
        // RATE LIMITING
        // ================================================================

        let failedAttempts = 0;
        const MAX_ATTEMPTS = 5;
        let blockTime = 0;

        // ================================================================
        // CHECK IF ALREADY LOGGED IN
        // ================================================================

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const adminDoc = await getDoc(doc(db, 'admins', user.uid));
                    if (adminDoc.exists() && adminDoc.data().role === 'admin') {
                        console.log('✅ Admin already logged in, redirecting...');
                        window.location.href = 'admin.html';
                    } else {
                        await signOut(auth);
                    }
                } catch (e) {
                    console.error('Error checking admin:', e);
                }
            }
        });

        // ================================================================
        // LOGIN FUNCTION
        // ================================================================

        async function handleLogin(event) {
            event.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const code = codeInput.value.trim();

            // Reset error
            errorMsg.style.display = 'none';

            // Check rate limit
            if (failedAttempts >= MAX_ATTEMPTS) {
                if (Date.now() - blockTime < 60000) {
                    errorText.textContent = `Too many failed attempts. Please wait 1 minute. (${Math.ceil((60000 - (Date.now() - blockTime)) / 1000)}s remaining)`;
                    errorMsg.style.display = 'block';
                    return;
                } else {
                    failedAttempts = 0; // Reset after timeout
                }
            }

            // Validate fields
            if (!email || !password || !code) {
                errorText.textContent = 'All fields are required.';
                errorMsg.style.display = 'block';
                return;
            }

            // Validate security code
            if (code !== SECRET_CODE) {
                failedAttempts++;
                errorText.textContent = `Invalid security code. Attempts: ${failedAttempts}/${MAX_ATTEMPTS}`;
                errorMsg.style.display = 'block';
                if (failedAttempts >= MAX_ATTEMPTS) {
                    blockTime = Date.now();
                }
                return;
            }

            // Disable button
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"></span> Logging in...';
            errorMsg.style.display = 'none';

            try {
                // Attempt login
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Check admin status
                const adminDoc = await getDoc(doc(db, 'admins', user.uid));
                if (!adminDoc.exists() || adminDoc.data().role !== 'admin') {
                    errorText.textContent = 'You are not authorized as an admin.';
                    errorMsg.style.display = 'block';
                    await signOut(auth);
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Login';
                    return;
                }

                // Success
                console.log('✅ Admin verified! Redirecting...');
                failedAttempts = 0; // Reset on success
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 500);

            } catch (error) {
                console.error('Login error:', error);

                let userMessage = error.message;
                if (error.code === 'auth/user-not-found') {
                    userMessage = 'No account found with this email.';
                } else if (error.code === 'auth/wrong-password') {
                    userMessage = 'Incorrect password.';
                } else if (error.code === 'auth/too-many-requests') {
                    userMessage = 'Too many failed attempts. Please wait a few minutes.';
                } else if (error.code === 'auth/network-request-failed') {
                    userMessage = 'Network error. Please check your internet connection.';
                }

                errorText.textContent = userMessage;
                errorMsg.style.display = 'block';
                failedAttempts++;

                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Login';
            }
        }

        // ================================================================
        // EVENT LISTENERS
        // ================================================================

        document.getElementById('loginForm').addEventListener('submit', handleLogin);

        // Allow Enter key on any field
        [emailInput, passwordInput, codeInput].forEach(input => {
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    document.getElementById('loginForm').dispatchEvent(new Event('submit'));
                }
            });
        });

        // ================================================================
        // CONSOLE LOG
        // ================================================================

        console.log('🔐 FixMyBlock Nepal - Secure Admin Login Loaded');
        console.log('💡 Security code required (set in the code)');
        console.log('🔑 Credentials pre-filled for testing (hidden from UI)');

        // Optional: Remove auto-fill for production
        // To remove auto-fill, clear the value attributes in the HTML above.
        // For now, they're pre-filled for quick testing.
    </script>

</body>
</html>
