<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FixMyBlock Nepal</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google Fonts for modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Main Styles -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <style>
        /* ===== ADDITIONAL STYLES FOR MAP ===== */
        #mapPicker {
            width: 100%;
            height: 250px;
            border-radius: 12px;
            margin-top: 8px;
            border: 2px solid #e0e4ea;
            overflow: hidden;
            position: relative;
        }
        .map-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #888;
            background: #f8f9fc;
        }
        .map-picker-label {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }
        .map-hint {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }
        /* Language toggle */
        .lang-toggle {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-toggle:hover {
            background: rgba(255,255,255,0.25);
        }
        /* Modern glassmorphism cards */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

    <!-- TOAST -->
    <div id="toast" class="toast"></div>

    <!-- APP -->
    <div class="app-container">

        <!-- HEADER -->
        <header class="app-header">
            <div class="logo">
                <i class="fas fa-road"></i>
                <span id="appName">FixMyBlock</span>
                <span class="subtitle" id="appSubtitle">Nepal</span>
            </div>
            <div class="header-right">
                <!-- Language Toggle -->
                <button class="lang-toggle" id="langToggle" title="Switch Language">🇳🇵 नेपाली</button>
                <span class="badge">LIVE</span>
                <button class="admin-toggle" onclick="window.location.href='login.html'" title="Admin login">
                    <i class="fas fa-user-shield"></i>
                </button>
            </div>
        </header>

        <!-- HOME SCREEN -->
        <div class="screen active" id="screen-home">
            <div class="stats-grid">
                <div class="stat-card glass-card">
                    <div class="number" id="statTotal">0</div>
                    <div class="label" data-key="totalReports">Total Reports</div>
                </div>
                <div class="stat-card resolved glass-card">
                    <div class="number" id="statResolved">0</div>
                    <div class="label" data-key="resolved">Resolved</div>
                </div>
                <div class="stat-card pending glass-card">
                    <div class="number" id="statPending">0</div>
                    <div class="label" data-key="pending">Pending</div>
                </div>
            </div>

            <div class="category-grid">
                <button class="category-btn glass-card" data-category="pothole" onclick="quickReport('pothole')">
                    <i class="fas fa-circle-exclamation"></i> <span data-key="pothole">Pothole</span>
                </button>
                <button class="category-btn glass-card" data-category="streetlight" onclick="quickReport('streetlight')">
                    <i class="fas fa-lightbulb"></i> <span data-key="streetlight">Streetlight</span>
                </button>
                <button class="category-btn glass-card" data-category="drainage" onclick="quickReport('drainage')">
                    <i class="fas fa-water"></i> <span data-key="drainage">Drainage</span>
                </button>
                <button class="category-btn glass-card" data-category="garbage" onclick="quickReport('garbage')">
                    <i class="fas fa-trash"></i> <span data-key="garbage">Garbage</span>
                </button>
                <button class="category-btn glass-card" data-category="landslide" onclick="quickReport('landslide')">
                    <i class="fas fa-mountain"></i> <span data-key="landslide">Landslide</span>
                </button>
            </div>

            <div class="section-title">
                <span>📋 <span data-key="recentReports">Recent Reports</span></span>
                <span class="report-count" id="reportCount">0 reports</span>
            </div>
            <div id="reportList">
                <div class="loading-state"><i class="fas fa-spinner fa-spin"></i> <span data-key="loading">Loading reports...</span></div>
            </div>

            <div class="text-center mt-16">
                <button class="btn btn-primary" onclick="showScreen('report')">
                    <i class="fas fa-plus-circle"></i> <span data-key="report">Report an Issue</span>
                </button>
            </div>
        </div>

        <!-- REPORT FORM -->
        <div class="screen" id="screen-report">
            <div class="flex-between mb-16">
                <button class="back-btn" onclick="showScreen('home')"><i class="fas fa-arrow-left"></i> <span data-key="back">Back</span></button>
                <span class="page-title" data-key="report">Report an Issue</span>
                <span class="spacer"></span>
            </div>

            <div class="form-group">
                <label data-key="selectCategory">Select Category <span class="required-star">*</span></label>
                <div class="category-grid" id="formCategoryGrid">
                    <button class="category-btn glass-card" data-category="pothole" onclick="selectFormCategory(this)">
                        <i class="fas fa-circle-exclamation"></i> <span data-key="pothole">Pothole</span>
                    </button>
                    <button class="category-btn glass-card" data-category="streetlight" onclick="selectFormCategory(this)">
                        <i class="fas fa-lightbulb"></i> <span data-key="streetlight">Streetlight</span>
                    </button>
                    <button class="category-btn glass-card" data-category="drainage" onclick="selectFormCategory(this)">
                        <i class="fas fa-water"></i> <span data-key="drainage">Drainage</span>
                    </button>
                    <button class="category-btn glass-card" data-category="garbage" onclick="selectFormCategory(this)">
                        <i class="fas fa-trash"></i> <span data-key="garbage">Garbage</span>
                    </button>
                    <button class="category-btn glass-card" data-category="landslide" onclick="selectFormCategory(this)">
                        <i class="fas fa-mountain"></i> <span data-key="landslide">Landslide</span>
                    </button>
                </div>
                <div id="formCategoryError" class="form-error">Please select a category</div>
            </div>

            <!-- PHOTO UPLOAD -->
            <div class="form-group">
                <label data-key="photo">Photo</label>
                <input type="file" id="photoInput" accept="image/*" class="hidden-input" title="Upload photo" />
                <div class="photo-buttons">
                    <button class="btn btn-outline btn-sm photo-action-btn" onclick="document.getElementById('photoInput').click();">
                        <i class="fas fa-camera"></i> <span data-key="takePhoto">Take Photo</span>
                    </button>
                    <button class="btn btn-outline btn-sm photo-action-btn" onclick="document.getElementById('photoInput').click();">
                        <i class="fas fa-image"></i> <span data-key="gallery">Gallery</span>
                    </button>
                </div>
                <div class="photo-preview" id="photoPreview">
                    <div class="placeholder-text">
                        <i class="fas fa-camera"></i>
                        <span data-key="noPhoto">No photo selected</span>
                    </div>
                </div>
            </div>

            <!-- MAP LOCATION PICKER (REPLACES TEXT INPUT) -->
            <div class="form-group">
                <label data-key="selectLocation">Select Location on Map</label>
                <div id="mapPicker" class="glass-card"></div>
                <div class="map-hint" data-key="dragMarker">Drag the marker or click on the map</div>
                <input type="hidden" id="selectedLat" value="27.7172" />
                <input type="hidden" id="selectedLng" value="85.3240" />
                <div class="location-status" id="locationStatus">📍 <span data-key="locationWaiting">Waiting for location...</span></div>
            </div>

            <div class="form-group">
                <label data-key="description">Description (optional)</label>
                <textarea id="descriptionInput" placeholder="Describe the issue in detail..."></textarea>
            </div>

            <div class="form-group">
                <label data-key="yourName">Your Name (optional)</label>
                <input type="text" id="nameInput" placeholder="e.g. Ram Sharma" />
            </div>

            <button class="btn btn-success" id="submitReportBtn">
                <i class="fas fa-paper-plane"></i> <span data-key="submit">Submit Report</span>
            </button>
        </div>

        <!-- BOTTOM NAV -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-screen="home" onclick="showScreen('home')">
                <i class="fas fa-home"></i> <span data-key="home">Home</span>
            </button>
            <button class="nav-item" data-screen="report" onclick="showScreen('report')">
                <div class="fab-wrapper"><div class="fab"><i class="fas fa-plus"></i></div></div>
                <span data-key="report">Report</span>
            </button>
        </nav>
    </div>

    <!-- ============================================================ -->
    <!-- ===== JAVASCRIPT (MODULE) ===== -->
    <!-- ============================================================ -->

    <script type="module">
        // ================================================================
        // 🔴 CONFIG: PASTE YOUR FIREBASE CONFIG & IMGBB KEY HERE
        // ================================================================

        const firebaseConfig = {
             apiKey: "AIzaSyBVvWlYUCOfALhtWdR53_ZcP5spTYhDyu8",
  authDomain: "fixmyblock-nepal.firebaseapp.com",
  projectId: "fixmyblock-nepal",
  storageBucket: "fixmyblock-nepal.firebasestorage.app",
  messagingSenderId: "742804276117",
  appId: "1:742804276117:web:ddab9eeff9a357c1112c9c",
  measurementId: "G-C3RQER0PC1"
        };

        const IMGBB_API_KEY = '2d59a842482977b8aa645a353ecbaafc';

        // ================================================================
        // IMPORTS
        // ================================================================

        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import {
            getFirestore,
            collection,
            query,
            orderBy,
            limit,
            getDocs,
            addDoc,
            serverTimestamp,
            onSnapshot,
            doc,
            updateDoc,
            deleteDoc
        } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

        // Translations
        import {
            translations,
            getTranslation,
            setLanguage,
            getCurrentLanguage,
            loadSavedLanguage
        } from './js/translations.js';

        // Map utilities
        import { initMapPicker, getMapPosition, setMapPosition, destroyMap } from './js/map-utils.js';

        // ================================================================
        // INIT FIREBASE
        // ================================================================

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        console.log('✅ Firebase initialized!');

        // ================================================================
        // LANGUAGE SETUP
        // ================================================================

        let currentLang = loadSavedLanguage() || 'en';
        const langToggle = document.getElementById('langToggle');

        function applyTranslations() {
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.dataset.key;
                el.textContent = getTranslation(key);
            });
            // Also update placeholders, attributes etc.
            document.getElementById('locationStatus').innerHTML = `📍 ${getTranslation('locationWaiting')}`;
            // Update button texts etc.
        }

        function toggleLanguage() {
            const newLang = currentLang === 'en' ? 'ne' : 'en';
            setLanguage(newLang);
            currentLang = newLang;
            langToggle.textContent = newLang === 'en' ? '🇳🇵 नेपाली' : '🇬🇧 English';
            applyTranslations();
            // Refresh reports to reflect status translations
            if (typeof renderReports === 'function') {
                renderReports(reports);
            }
        }

        langToggle.addEventListener('click', toggleLanguage);

        // Initial language
        if (currentLang === 'ne') {
            langToggle.textContent = '🇬🇧 English';
        } else {
            langToggle.textContent = '🇳🇵 नेपाली';
        }
        applyTranslations();

        // ================================================================
        // CATEGORIES & STATUSES
        // ================================================================

        const CATEGORIES = {
            pothole: { label: getTranslation('pothole'), icon: 'fa-circle-exclamation' },
            streetlight: { label: getTranslation('streetlight'), icon: 'fa-lightbulb' },
            drainage: { label: getTranslation('drainage'), icon: 'fa-water' },
            garbage: { label: getTranslation('garbage'), icon: 'fa-trash' },
            landslide: { label: getTranslation('landslide'), icon: 'fa-mountain' }
        };

        const STATUSES = {
            submitted: { label: getTranslation('statusSubmitted'), class: 'status-submitted' },
            reviewing: { label: getTranslation('statusReviewing'), class: 'status-reviewing' },
            in_progress: { label: getTranslation('statusProgress'), class: 'status-progress' },
            resolved: { label: getTranslation('statusResolved'), class: 'status-resolved' },
            rejected: { label: getTranslation('statusRejected'), class: 'status-rejected' }
        };

        // Helper functions (using translations)
        function getCategoryLabel(cat) {
            const key = CATEGORIES[cat]?.label || cat;
            return getTranslation(key) || key;
        }

        function getCategoryIcon(cat) { return CATEGORIES[cat]?.icon || 'fa-question'; }

        function getStatusLabel(status) {
            const key = STATUSES[status]?.label || status;
            return getTranslation(key) || key;
        }

        function getStatusClass(status) { return STATUSES[status]?.class || ''; }

        function formatTimestamp(ts) {
            if (!ts) return 'Recently';
            try {
                const diff = Date.now() - ts.toMillis();
                if (diff < 60000) return getTranslation('justNow') || 'Just now';
                if (diff < 3600000) return Math.floor(diff / 60000) + ' min ago';
                if (diff < 86400000) return Math.floor(diff / 3600000) + ' hours ago';
                return Math.floor(diff / 86400000) + ' days ago';
            } catch { return 'Recently'; }
        }

        // ================================================================
        // TOAST
        // ================================================================

        function showToast(msg, type = '') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast ' + type;
            void el.offsetWidth;
            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 3000);
        }

        // ================================================================
        // SCREEN NAVIGATION
        // ================================================================

        window.showScreen = function(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            const target = document.getElementById('screen-' + screenId);
            if (target) target.classList.add('active');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const navBtn = document.querySelector(`.nav-item[data-screen="${screenId}"]`);
            if (navBtn) navBtn.classList.add('active');

            if (screenId === 'report') {
                // Initialize map if not already
                if (!window._mapInitialized) {
                    initMapPicker('mapPicker', 27.7172, 85.3240, (lat, lng) => {
                        document.getElementById('selectedLat').value = lat;
                        document.getElementById('selectedLng').value = lng;
                        document.getElementById('locationStatus').innerHTML =
                            `📍 ${getTranslation('locationReady')} ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
                    });
                    window._mapInitialized = true;
                }
                document.getElementById('formCategoryError').style.display = 'none';
            }
        };

        // ================================================================
        // REPORT LISTENER (with performance caching)
        // ================================================================

        let reports = [];

        function listenToReports() {
            console.log('📡 Setting up Firestore listener (cached)...');

            const q = query(collection(db, 'reports'), orderBy('createdAt', 'desc'), limit(50));

            // Use onSnapshot for real-time updates with cache
            onSnapshot(q, (snapshot) => {
                console.log('✅ Snapshot received! Size:', snapshot.size);
                reports = [];
                snapshot.forEach((doc) => {
                    reports.push({ id: doc.id, ...doc.data() });
                });
                renderReports(reports);
                updateStats(reports);
            }, (error) => {
                console.error('❌ Listener error:', error);
                document.getElementById('reportList').innerHTML = `
                        <div class="error-state">
                            <i class="fas fa-exclamation-circle"></i>
                            <h3>Error Loading Reports</h3>
                            <p>${error.message}</p>
                            <button onclick="location.reload()" class="btn btn-primary btn-sm retry-btn">Retry</button>
                        </div>
                    `;
            });
        }

        function renderReports(reports) {
            const container = document.getElementById('reportList');
            document.getElementById('reportCount').textContent = reports.length + ' ' + getTranslation('reports');

            if (reports.length === 0) {
                container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <h3>${getTranslation('noReports')}</h3>
                            <p>${getTranslation('beFirst')}</p>
                        </div>
                    `;
                return;
            }

            container.innerHTML = reports.map(r => `
                    <div class="report-card glass-card">
                        <div class="top-row">
                            <div>
                                <span class="icon-spacing"><i class="fas ${getCategoryIcon(r.category)}"></i></span>
                                <span class="title">${getCategoryLabel(r.category)}</span>
                            </div>
                            <span class="status-badge ${getStatusClass(r.status || 'submitted')}">${getStatusLabel(r.status || 'submitted')}</span>
                        </div>
                        <div class="location"><i class="fas fa-location-dot"></i> ${r.location || 'Unknown location'}</div>
                        <div class="report-description">${r.description ? r.description.substring(0, 80) + (r.description.length > 80 ? '...' : '') : 'No description'}</div>
                        <div class="footer">
                            <span>${formatTimestamp(r.createdAt)}</span>
                            ${r.photoUrl ? '<span><i class="fas fa-image"></i> Photo</span>' : ''}
                            <span><i class="fas fa-chevron-right small-icon"></i></span>
                        </div>
                    </div>
                `).join('');
        }

        function updateStats(reports) {
            const total = reports.length;
            const resolved = reports.filter(r => r.status === 'resolved').length;
            const pending = reports.filter(r => r.status !== 'resolved' && r.status !== 'rejected').length;
            document.getElementById('statTotal').textContent = total;
            document.getElementById('statResolved').textContent = resolved;
            document.getElementById('statPending').textContent = pending;
        }

        // ================================================================
        // REPORT FORM (with map integration)
        // ================================================================

        let selectedCategory = null;

        window.selectFormCategory = function(el) {
            document.querySelectorAll('#formCategoryGrid .category-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            selectedCategory = el.dataset.category;
            document.getElementById('formCategoryError').style.display = 'none';
        };

        window.quickReport = function(category) {
            showScreen('report');
            document.querySelectorAll('#formCategoryGrid .category-btn').forEach(b => {
                b.classList.remove('selected');
                if (b.dataset.category === category) {
                    b.classList.add('selected');
                    selectedCategory = category;
                }
            });
            document.getElementById('formCategoryError').style.display = 'none';
        };

        // Photo preview
        document.getElementById('photoInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(ev) {
                document.getElementById('photoPreview').innerHTML = `<img src="${ev.target.result}" alt="Photo" />`;
            };
            reader.readAsDataURL(file);
        });

        // ImgBB upload
        async function uploadToImgBB(file) {
            const formData = new FormData();
            formData.append('key', IMGBB_API_KEY);
            formData.append('image', file);
            try {
                const response = await fetch('https://api.imgbb.com/1/upload', { method: 'POST', body: formData });
                const data = await response.json();
                if (data.success) return data.data.url;
                else return '';
            } catch (error) { return ''; }
        }

        // Submit report
        document.getElementById('submitReportBtn').addEventListener('click', async function() {
            const btn = this;
            if (btn.disabled) return;

            if (!selectedCategory) {
                document.getElementById('formCategoryError').style.display = 'block';
                showToast(getTranslation('selectCategoryError'), 'error');
                return;
            }

            // Get location from map
            const pos = getMapPosition();
            const lat = pos ? pos.lat : parseFloat(document.getElementById('selectedLat').value) || 27.7172;
            const lng = pos ? pos.lng : parseFloat(document.getElementById('selectedLng').value) || 85.3240;

            // Reverse geocode: we just save coordinates, not address (we can use a simple location name from coords, but we keep it simple)
            // We'll store a placeholder address or let admin see coords on map.
            const locationName = `Lat: ${lat.toFixed(4)}, Lng: ${lng.toFixed(4)}`;

            const description = document.getElementById('descriptionInput').value.trim();
            const name = document.getElementById('nameInput').value.trim() || 'Anonymous';

            btn.disabled = true;
            btn.innerHTML = `<span class="spinner"></span> ${getTranslation('submitting')}`;

            try {
                let photoUrl = '';
                const photoInput = document.getElementById('photoInput');
                if (photoInput.files.length > 0) {
                    photoUrl = await uploadToImgBB(photoInput.files[0]);
                }

                await addDoc(collection(db, 'reports'), {
                    category: selectedCategory,
                    description: description || 'No description provided',
                    location: locationName,
                    latitude: lat,
                    longitude: lng,
                    photoUrl: photoUrl || '',
                    status: 'submitted',
                    submittedBy: name,
                    createdAt: serverTimestamp()
                });

                showToast(getTranslation('submitSuccess'), 'success');

                // Reset form
                document.querySelectorAll('#formCategoryGrid .category-btn').forEach(b => b.classList.remove('selected'));
                document.getElementById('photoPreview').innerHTML =
                    `<div class="placeholder-text"><i class="fas fa-camera"></i><span>${getTranslation('noPhoto')}</span></div>`;
                document.getElementById('descriptionInput').value = '';
                document.getElementById('nameInput').value = '';
                document.getElementById('photoInput').value = '';
                selectedCategory = null;
                // Reset map to default position
                setMapPosition(27.7172, 85.3240);
                document.getElementById('selectedLat').value = '27.7172';
                document.getElementById('selectedLng').value = '85.3240';
                document.getElementById('locationStatus').innerHTML = `📍 ${getTranslation('locationWaiting')}`;
                showScreen('home');

            } catch (error) {
                console.error('Submit error:', error);
                showToast(getTranslation('submitError') + ': ' + error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-paper-plane"></i> ${getTranslation('submit')}`;
            }
        });

        // ================================================================
        // INIT
        // ================================================================

        // Check connection
        async function testConnection() {
            try {
                console.log('📡 Testing Firestore connection...');
                const q = collection(db, 'reports');
                await getDocs(q);
                console.log('✅ Firestore connection successful!');
                listenToReports();
            } catch (error) {
                console.error('❌ Firestore connection failed:', error);
                document.getElementById('reportList').innerHTML = `
                        <div class="error-state">
                            <i class="fas fa-exclamation-circle"></i>
                            <h3>Connection Error</h3>
                            <p>${error.message}</p>
                            <button onclick="location.reload()" class="btn btn-primary btn-sm retry-btn">Retry</button>
                        </div>
                    `;
            }
        }

        testConnection();

        console.log('🏗️ FixMyBlock Nepal - Updated with Map & Translation!');
    </script>

</body>
</html>
