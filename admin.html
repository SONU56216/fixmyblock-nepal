<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - FixMyBlock Nepal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <style>
        /* Admin map styles */
        .admin-report-item .mini-map {
            width: 100%;
            height: 150px;
            border-radius: 8px;
            margin-top: 8px;
            border: 1px solid #e8ecf2;
            overflow: hidden;
            background: #f8f9fc;
        }
        .admin-report-item .mini-map .map-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #888;
            font-size: 13px;
        }
        .admin-report-item .info {
            flex: 1;
            min-width: 220px;
        }
        .admin-report-item {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .admin-report-item .top-section {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .admin-report-item .bottom-section {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .admin-report-item .bottom-section .map-col {
            flex: 1;
            min-width: 200px;
        }
        .admin-report-item .bottom-section .info-col {
            flex: 2;
            min-width: 250px;
        }
        /* Modern glassmorphism for admin cards */
        .admin-report-item {
            background: rgba(255, 255, 255, 0.7);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.04);
            padding: 18px;
            margin-bottom: 14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .admin-report-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }
        /* Language toggle in admin */
        .lang-toggle-admin {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-toggle-admin:hover {
            background: rgba(255,255,255,0.25);
        }
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <div class="admin-container">

        <header class="admin-header">
            <div class="logo">
                <i class="fas fa-road"></i>
                <span>FixMyBlock</span>
                <span class="subtitle">Admin</span>
            </div>
            <div class="header-right">
                <button class="lang-toggle-admin" id="langToggleAdmin">🇳🇵 नेपाली</button>
                <span class="badge">● LIVE</span>
                <button class="btn btn-outline btn-sm" onclick="refreshReports()">
                    <i class="fas fa-sync"></i> Refresh
                </button>
                <button class="btn btn-danger btn-sm" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </header>

        <div class="admin-body">

            <div class="admin-stats" id="adminStats">
                <div class="admin-stat glass-card">
                    <div class="num total" id="adminTotal">0</div>
                    <div class="lbl" data-key="total">Total</div>
                </div>
                <div class="admin-stat glass-card">
                    <div class="num submitted" id="adminSubmitted">0</div>
                    <div class="lbl" data-key="submitted">Submitted</div>
                </div>
                <div class="admin-stat glass-card">
                    <div class="num progress" id="adminProgress">0</div>
                    <div class="lbl" data-key="inProgress">In Progress</div>
                </div>
                <div class="admin-stat glass-card">
                    <div class="num resolved" id="adminResolved">0</div>
                    <div class="lbl" data-key="resolved">Resolved</div>
                </div>
            </div>

            <div class="admin-actions">
                <button class="btn btn-success btn-sm" onclick="exportExcel()">
                    <i class="fas fa-file-excel"></i> <span data-key="exportExcel">Export Excel</span>
                </button>
                <button class="btn btn-danger btn-sm" onclick="clearAllReports()">
                    <i class="fas fa-trash"></i> <span data-key="clearAll">Clear All</span>
                </button>
                <div class="search-box">
                    <input type="text" id="adminSearch" placeholder="🔍 Search reports..." oninput="applyFiltersAndSort()" />
                </div>
            </div>

            <div class="filters-row">
                <span class="label" data-key="priority">Priority:</span>
                <button class="filter-priority-btn active" onclick="filterByPriority('all')" data-key="all">All</button>
                <button class="filter-priority-btn priority-low" onclick="filterByPriority('LOW')" data-key="low">🟢 Low</button>
                <button class="filter-priority-btn priority-medium" onclick="filterByPriority('MEDIUM')" data-key="medium">🟡 Medium</button>
                <button class="filter-priority-btn priority-high" onclick="filterByPriority('HIGH')" data-key="high">🟠 High</button>
                <button class="filter-priority-btn priority-critical" onclick="filterByPriority('CRITICAL')" data-key="critical">🔴 Critical</button>
            </div>

            <div class="sort-row">
                <label class="sort-label" for="adminSortSelect" data-key="sortBy">Sort by:</label>
                <select id="adminSortSelect" class="sort-select" title="Sort reports" onchange="sortReports(this.value)">
                    <option value="newest" data-key="newest">Newest</option>
                    <option value="oldest" data-key="oldest">Oldest</option>
                    <option value="supported" data-key="mostSupported">Most Supported</option>
                    <option value="priority" data-key="highestPriority">Highest Priority</option>
                </select>
            </div>

            <div id="adminReportList">
                <div class="loading-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading reports...</p>
                </div>
            </div>

        </div>
    </div>

    <!-- ============================================================ -->
    <!-- ===== JAVASCRIPT (MODULE) ===== -->
    <!-- ============================================================ -->

    <script type="module">
        // ================================================================
        // 🔴 CONFIG: PASTE YOUR FIREBASE CONFIG HERE
        // ================================================================

        const firebaseConfig = {
             apiKey: "AIzaSyBVvWlYUCOfALhtWdR53_ZcP5spTYhDyu8",
  authDomain: "fixmyblock-nepal.firebaseapp.com",
  projectId: "fixmyblock-nepal",
  storageBucket: "fixmyblock-nepal.firebasestorage.app",
  messagingSenderId: "742804276117",
  appId: "1:742804276117:web:ddab9eeff9a357c1112c9c",
  measurementId: "G-C3RQER0PC1"
        };

        // ================================================================
        // IMPORTS
        // ================================================================

        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
        import {
            getFirestore,
            collection,
            query,
            orderBy,
            getDocs,
            doc,
            getDoc,
            updateDoc,
            deleteDoc,
            onSnapshot
        } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

        import { translations, getTranslation, setLanguage, loadSavedLanguage } from './js/translations.js';
        import { initStaticMap } from './js/map-utils.js';

        // ================================================================
        // INIT FIREBASE
        // ================================================================

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        console.log('✅ Firebase Admin initialized!');

        // ================================================================
        // LANGUAGE SETUP
        // ================================================================

        let currentLang = loadSavedLanguage() || 'en';
        const langToggleAdmin = document.getElementById('langToggleAdmin');

        function applyTranslationsAdmin() {
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.dataset.key;
                el.textContent = getTranslation(key);
            });
        }

        function toggleLanguageAdmin() {
            const newLang = currentLang === 'en' ? 'ne' : 'en';
            setLanguage(newLang);
            currentLang = newLang;
            langToggleAdmin.textContent = newLang === 'en' ? '🇳🇵 नेपाली' : '🇬🇧 English';
            applyTranslationsAdmin();
            // Refresh reports to update status labels etc.
            renderAdminReports();
        }

        langToggleAdmin.addEventListener('click', toggleLanguageAdmin);
        if (currentLang === 'ne') {
            langToggleAdmin.textContent = '🇬🇧 English';
        } else {
            langToggleAdmin.textContent = '🇳🇵 नेपाली';
        }
        applyTranslationsAdmin();

        // ================================================================
        // HELPERS (using translations)
        // ================================================================

        const CATEGORIES = {
            pothole: { label: getTranslation('pothole'), icon: 'fa-circle-exclamation' },
            streetlight: { label: getTranslation('streetlight'), icon: 'fa-lightbulb' },
            drainage: { label: getTranslation('drainage'), icon: 'fa-water' },
            garbage: { label: getTranslation('garbage'), icon: 'fa-trash' },
            landslide: { label: getTranslation('landslide'), icon: 'fa-mountain' }
        };

        const STATUSES = {
            submitted: { label: getTranslation('statusSubmitted'), class: 'status-submitted' },
            reviewing: { label: getTranslation('statusReviewing'), class: 'status-reviewing' },
            in_progress: { label: getTranslation('statusProgress'), class: 'status-progress' },
            resolved: { label: getTranslation('statusResolved'), class: 'status-resolved' },
            rejected: { label: getTranslation('statusRejected'), class: 'status-rejected' }
        };

        const PRIORITY_ICONS = {
            LOW: 'fa-arrow-down',
            MEDIUM: 'fa-minus',
            HIGH: 'fa-arrow-up',
            CRITICAL: 'fa-exclamation-triangle'
        };

        const PRIORITY_ORDER = { CRITICAL: 0, HIGH: 1, MEDIUM: 2, LOW: 3 };

        function getCategoryLabel(cat) {
            const key = CATEGORIES[cat]?.label || cat;
            return getTranslation(key) || key;
        }

        function getCategoryIcon(cat) { return CATEGORIES[cat]?.icon || 'fa-question'; }

        function getStatusLabel(status) {
            const key = STATUSES[status]?.label || status;
            return getTranslation(key) || key;
        }

        function getStatusClass(status) { return STATUSES[status]?.class || ''; }

        function formatTimestamp(ts) {
            if (!ts) return 'Recently';
            try {
                const diff = Date.now() - ts.toMillis();
                if (diff < 60000) return getTranslation('justNow') || 'Just now';
                if (diff < 3600000) return Math.floor(diff / 60000) + ' min ago';
                if (diff < 86400000) return Math.floor(diff / 3600000) + ' hours ago';
                return Math.floor(diff / 86400000) + ' days ago';
            } catch { return 'Recently'; }
        }

        let allReports = [];
        let filteredReports = [];
        let currentPriorityFilter = 'all';
        let currentSort = 'newest';

        function showToast(msg, type = '') {
            const el = document.getElementById('toast');
            if (!el) return;
            el.textContent = msg;
            el.className = 'toast ' + type;
            void el.offsetWidth;
            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 3500);
        }

        // ================================================================
        // AUTH
        // ================================================================

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            try {
                const adminDoc = await getDoc(doc(db, 'admins', user.uid));
                if (!adminDoc.exists() || adminDoc.data().role !== 'admin') {
                    await signOut(auth);
                    window.location.href = 'login.html';
                    return;
                }
                console.log('✅ Admin verified! Loading reports...');
                if (window._listenerUnsubscribe) window._listenerUnsubscribe();
                listenToReports();
            } catch (error) {
                console.error('Error checking admin:', error);
                document.getElementById('adminReportList').innerHTML = `
                        <div class="error-state">
                            <i class="fas fa-exclamation-circle"></i>
                            <h3>Error checking admin status</h3>
                            <p>${error.message}</p>
                            <button onclick="location.reload()" class="btn btn-primary btn-sm retry-btn">Retry</button>
                        </div>
                    `;
            }
        });

        window.logout = async function() {
            await signOut(auth);
            window.location.href = 'login.html';
        };

        // ================================================================
        // LISTEN TO REPORTS
        // ================================================================

        function listenToReports() {
            const q = query(collection(db, 'reports'), orderBy('createdAt', 'desc'));

            const unsubscribe = onSnapshot(q, (snapshot) => {
                console.log('✅ Admin Snapshot size:', snapshot.size);
                allReports = [];
                snapshot.forEach((doc) => {
                    allReports.push({ id: doc.id, ...doc.data() });
                });
                applyFiltersAndSort();
                updateStats();
            }, (error) => {
                console.error('Listener error:', error);
                document.getElementById('adminReportList').innerHTML = `
                        <div class="error-state">
                            <i class="fas fa-exclamation-circle"></i>
                            <h3>Error Loading Reports</h3>
                            <p>${error.message}</p>
                            <button onclick="location.reload()" class="btn btn-primary btn-sm retry-btn">Retry</button>
                        </div>
                    `;
            });

            window._listenerUnsubscribe = unsubscribe;
        }

        // ================================================================
        // FILTERS & SORTING
        // ================================================================

        window.filterByPriority = function(priority) {
            currentPriorityFilter = priority;
            document.querySelectorAll('.filter-priority-btn').forEach(btn => btn.classList.remove('active'));
            if (priority === 'all') {
                document.querySelector('.filter-priority-btn')?.classList.add('active');
            } else {
                const btn = document.querySelector(`.filter-priority-btn.priority-${priority.toLowerCase()}`);
                if (btn) btn.classList.add('active');
            }
            applyFiltersAndSort();
        };

        window.sortReports = function(sort) {
            currentSort = sort;
            applyFiltersAndSort();
        };

        window.applyFiltersAndSort = function() {
            const search = document.getElementById('adminSearch')?.value.toLowerCase().trim() || '';

            let filtered = allReports;
            if (currentPriorityFilter !== 'all') {
                filtered = filtered.filter(r => (r.priority || 'LOW') === currentPriorityFilter);
            }

            if (search) {
                filtered = filtered.filter(r =>
                    (r.location || '').toLowerCase().includes(search) ||
                    (r.description || '').toLowerCase().includes(search) ||
                    (r.category || '').toLowerCase().includes(search) ||
                    (r.submittedBy || '').toLowerCase().includes(search) ||
                    r.id.toLowerCase().includes(search)
                );
            }

            switch (currentSort) {
                case 'priority':
                    filtered.sort((a, b) =>
                        (PRIORITY_ORDER[a.priority || 'LOW'] || 4) - (PRIORITY_ORDER[b.priority || 'LOW'] || 4)
                    );
                    break;
                case 'supported':
                    filtered.sort((a, b) => (b.affectedCount || 0) - (a.affectedCount || 0));
                    break;
                case 'oldest':
                    filtered.sort((a, b) => (a.createdAt?.toMillis() || 0) - (b.createdAt?.toMillis() || 0));
                    break;
                case 'newest':
                default:
                    filtered.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    break;
            }

            filteredReports = filtered;
            renderAdminReports();
        };

        // ================================================================
        // RENDER ADMIN REPORTS (with map)
        // ================================================================

        function renderAdminReports() {
            const container = document.getElementById('adminReportList');

            if (filteredReports.length === 0) {
                container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <h3>${getTranslation('noReports')}</h3>
                            <p>${allReports.length === 0 ? 'No reports submitted yet.' : 'Try adjusting your search or filters.'}</p>
                        </div>
                    `;
                return;
            }

            container.innerHTML = filteredReports.map(r => {
                const priority = r.priority || 'LOW';
                const priorityClass = priority.toLowerCase();
                const priorityIcon = PRIORITY_ICONS[priority] || 'fa-circle';
                const affected = r.affectedCount || 0;
                const supporters = (r.supportedBy || []).length;

                return `
                        <div class="admin-report-item">
                            <div class="top-section">
                                <div class="info-col">
                                    <div class="title">
                                        <span class="report-id">#${r.id.substring(0, 8)}</span>
                                        <i class="fas ${getCategoryIcon(r.category)} category-icon"></i>
                                        ${getCategoryLabel(r.category)}
                                        <span class="priority-badge priority-${priorityClass}">
                                            <i class="fas ${priorityIcon}"></i> ${priority}
                                        </span>
                                    </div>
                                    <div class="loc"><i class="fas fa-location-dot"></i> ${r.location || 'Unknown'}</div>
                                    <div class="meta">
                                        ${formatTimestamp(r.createdAt)} ·
                                        ${r.submittedBy || 'Anonymous'} ·
                                        ${r.latitude ? `${r.latitude.toFixed(4)}, ${r.longitude?.toFixed(4) || ''}` : ''}
                                    </div>
                                    <div class="community-stats">
                                        <span class="stat-item"><i class="fas fa-users"></i> <span class="count">${affected}</span> affected</span>
                                        <span class="stat-item"><i class="fas fa-hand-peace"></i> <span class="count">${supporters}</span> supporters</span>
                                    </div>
                                    ${r.description ? `<div class="desc">📝 ${r.description}</div>` : ''}
                                    ${r.photoUrl ? `<div class="photo-link">📷 <a href="${r.photoUrl}" target="_blank">View Photo</a></div>` : ''}
                                </div>
                                <div class="admin-report-actions">
                                    <span class="status-badge ${getStatusClass(r.status || 'submitted')}">${getStatusLabel(r.status || 'submitted')}</span>
                                    <select onchange="updateStatus('${r.id}', this.value)">
                                        <option value="submitted" ${(r.status || 'submitted') === 'submitted' ? 'selected' : ''}>Submitted</option>
                                        <option value="reviewing" ${(r.status || 'submitted') === 'reviewing' ? 'selected' : ''}>Under Review</option>
                                        <option value="in_progress" ${(r.status || 'submitted') === 'in_progress' ? 'selected' : ''}>In Progress</option>
                                        <option value="resolved" ${(r.status || 'submitted') === 'resolved' ? 'selected' : ''}>Resolved</option>
                                        <option value="rejected" ${(r.status || 'submitted') === 'rejected' ? 'selected' : ''}>Rejected</option>
                                    </select>
                                    <button class="btn btn-danger btn-sm btn-delete" onclick="deleteReport('${r.id}')">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="bottom-section">
                                <div class="map-col">
                                    <div class="mini-map" id="map-${r.id}"></div>
                                </div>
                            </div>
                        </div>
                    `;
            }).join('');

            // Initialize maps for each report
            filteredReports.forEach(r => {
                if (r.latitude && r.longitude) {
                    const mapId = `map-${r.id}`;
                    const container = document.getElementById(mapId);
                    if (container) {
                        initStaticMap(mapId, r.latitude, r.longitude, `<b>${getCategoryLabel(r.category)}</b><br>${r.location}`);
                    }
                }
            });
        }

        // ================================================================
        // UPDATE STATS
        // ================================================================

        function updateStats() {
            const total = allReports.length;
            const submitted = allReports.filter(r => r.status === 'submitted').length;
            const progress = allReports.filter(r => r.status === 'reviewing' || r.status === 'in_progress').length;
            const resolved = allReports.filter(r => r.status === 'resolved').length;

            document.getElementById('adminTotal').textContent = total;
            document.getElementById('adminSubmitted').textContent = submitted;
            document.getElementById('adminProgress').textContent = progress;
            document.getElementById('adminResolved').textContent = resolved;
        }

        // ================================================================
        // ACTIONS
        // ================================================================

        window.updateStatus = async function(reportId, newStatus) {
            try {
                await updateDoc(doc(db, 'reports', reportId), {
                    status: newStatus,
                    updatedAt: new Date().toISOString()
                });
                showToast(`✅ Report updated to "${getStatusLabel(newStatus)}"`, 'success');
            } catch (error) {
                showToast('❌ Error updating status: ' + error.message, 'error');
            }
        };

        window.deleteReport = async function(reportId) {
            if (!confirm('Are you sure? This cannot be undone.')) return;
            try {
                await deleteDoc(doc(db, 'reports', reportId));
                showToast('🗑️ Report deleted', 'info');
                applyFiltersAndSort();
            } catch (error) {
                showToast('❌ Error deleting report: ' + error.message, 'error');
            }
        };

        window.refreshReports = function() {
            showToast('🔄 Refreshing...', 'info');
            applyFiltersAndSort();
        };

        window.exportExcel = function() {
            if (allReports.length === 0) {
                showToast('📭 No reports to export', 'error');
                return;
            }
            const headers = ['ID', 'Category', 'Description', 'Location', 'Latitude', 'Longitude', 'Photo URL', 'Status',
                'Priority', 'Affected Count', 'Supporters', 'Submitted By', 'Date'
            ];
            const rows = allReports.map(r => [
                r.id || '',
                getCategoryLabel(r.category) || '',
                (r.description || '').replace(/,/g, ';'),
                (r.location || '').replace(/,/g, ';'),
                r.latitude || '',
                r.longitude || '',
                r.photoUrl || '',
                getStatusLabel(r.status || 'submitted'),
                r.priority || 'LOW',
                r.affectedCount || 0,
                (r.supportedBy || []).length,
                r.submittedBy || 'Anonymous',
                r.createdAt ? new Date(r.createdAt.toMillis()).toLocaleString() : ''
            ]);
            let csv = headers.join(',') + '\n';
            rows.forEach(row => csv += row.join(',') + '\n');
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `FixMyBlock_Reports_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('📊 Excel file downloaded!', 'success');
        };

        window.clearAllReports = async function() {
            if (!confirm('Delete ALL reports? This cannot be undone!')) return;
            try {
                const q = query(collection(db, 'reports'));
                const snapshot = await getDocs(q);
                for (const doc of snapshot.docs) {
                    await deleteDoc(doc.ref);
                }
                showToast('🗑️ All reports cleared', 'info');
            } catch (error) {
                showToast('❌ Error clearing reports: ' + error.message, 'error');
            }
        };

        // ================================================================
        // INIT
        // ================================================================

        console.log('👑 FixMyBlock Nepal - Admin Dashboard Loaded');
        // Auth guard handles the listener

        // Expose functions globally
        window.filterByPriority = filterByPriority;
        window.sortReports = sortReports;
        window.applyFiltersAndSort = applyFiltersAndSort;
        window.updateStatus = updateStatus;
        window.deleteReport = deleteReport;
        window.refreshReports = refreshReports;
        window.exportExcel = exportExcel;
        window.clearAllReports = clearAllReports;
        window.logout = logout;
    </script>

</body>
</html>
