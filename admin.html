<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - FixMyBlock Nepal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            min-height: 100vh;
        }
        .admin-container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            min-height: 100vh;
            padding: 0 24px 40px;
        }
        .admin-header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 0 0 20px 20px;
            margin: 0 -24px 24px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .admin-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
        }
        .admin-header .logo i {
            font-size: 26px;
            color: #1a73e8;
        }
        .admin-header .logo .subtitle {
            font-size: 12px;
            font-weight: 400;
            opacity: 0.7;
            margin-left: -4px;
        }
        .admin-header .badge {
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            width: auto;
            font-family: inherit;
        }
        .btn-outline {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .btn-danger {
            background: #ea4335;
            color: #fff;
        }
        .btn-danger:hover {
            background: #c62828;
        }
        .btn-success {
            background: #34a853;
            color: #fff;
        }
        .btn-success:hover {
            background: #2d9248;
        }
        .btn-primary {
            background: #1a73e8;
            color: #fff;
        }
        .btn-primary:hover {
            background: #1557b0;
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
        }

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 22px;
        }
        .admin-stat {
            background: #f8f9fc;
            border-radius: 12px;
            padding: 16px 12px;
            text-align: center;
            border: 1px solid #e8ecf2;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .admin-stat:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
        }
        .admin-stat .num {
            font-size: 30px;
            font-weight: 700;
            color: #1a1a2e;
        }
        .admin-stat .lbl {
            font-size: 12px;
            color: #5f6b7a;
            margin-top: 2px;
        }
        .admin-stat .num.submitted {
            color: #0d47a1;
        }
        .admin-stat .num.progress {
            color: #e65100;
        }
        .admin-stat .num.resolved {
            color: #1b5e20;
        }
        .admin-stat .num.total {
            color: #1a73e8;
        }
        .admin-stat .num.emergency {
            color: #ea4335;
        }

        .admin-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .admin-actions .search-box {
            flex: 2;
            min-width: 200px;
        }
        .admin-actions .search-box input {
            width: 100%;
            padding: 10px 16px;
            border: 2px solid #e0e4ea;
            border-radius: 10px;
            font-size: 14px;
            background: #fafbfc;
            transition: border 0.2s, box-shadow 0.2s;
        }
        .admin-actions .search-box input:focus {
            outline: none;
            border-color: #1a73e8;
            box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.1);
            background: #fff;
        }

        .filters-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #f0f2f5;
        }
        .filters-row .label {
            font-size: 13px;
            font-weight: 600;
            color: #5f6b7a;
            margin-right: 4px;
        }
        .filter-priority-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: 2px solid #e8ecf2;
            background: transparent;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #555;
        }
        .filter-priority-btn:hover {
            border-color: #1a73e8;
            color: #1a73e8;
        }
        .filter-priority-btn.active {
            border-color: #1a73e8;
            background: #e8f0fe;
            color: #1a73e8;
        }
        .filter-priority-btn.priority-low {
            border-color: #34a853;
            color: #34a853;
        }
        .filter-priority-btn.priority-low.active {
            background: #e8f5e9;
        }
        .filter-priority-btn.priority-medium {
            border-color: #fbbc04;
            color: #fbbc04;
        }
        .filter-priority-btn.priority-medium.active {
            background: #fff8e1;
        }
        .filter-priority-btn.priority-high {
            border-color: #ff6b00;
            color: #ff6b00;
        }
        .filter-priority-btn.priority-high.active {
            background: #fff3e0;
        }
        .filter-priority-btn.priority-critical {
            border-color: #ea4335;
            color: #ea4335;
        }
        .filter-priority-btn.priority-critical.active {
            background: #fce4ec;
        }

        .sort-select {
            padding: 6px 14px;
            border-radius: 8px;
            border: 2px solid #e8ecf2;
            font-size: 13px;
            background: #fff;
            cursor: pointer;
            color: #333;
            transition: border 0.2s;
        }
        .sort-select:focus {
            outline: none;
            border-color: #1a73e8;
        }

        /* ===== ADMIN REPORT ITEM ===== */
        .admin-report-item {
            background: #ffffff;
            border: 1px solid #e8ecf2;
            border-radius: 12px;
            padding: 16px 18px;
            margin-bottom: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            transition: all 0.2s;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
        }
        .admin-report-item:hover {
            border-color: #1a73e8;
            box-shadow: 0 4px 16px rgba(26, 115, 232, 0.08);
        }
        .admin-report-item .info {
            flex: 1;
            min-width: 220px;
        }
        .admin-report-item .info .title {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 2px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }
        .admin-report-item .info .title .report-id {
            color: #888;
            font-weight: 400;
            font-size: 13px;
        }
        .admin-report-item .info .title .category-icon {
            margin: 0 2px;
        }
        .admin-report-item .info .loc {
            font-size: 13px;
            color: #5f6b7a;
            margin: 2px 0;
        }
        .admin-report-item .info .loc i {
            margin-right: 4px;
            font-size: 12px;
        }
        .admin-report-item .info .meta {
            font-size: 12px;
            color: #888;
            margin-top: 2px;
        }
        .admin-report-item .info .desc {
            font-size: 13px;
            color: #444;
            margin-top: 6px;
            padding: 8px 12px;
            background: #f8f9fc;
            border-radius: 8px;
            border-left: 3px solid #1a73e8;
        }
        .admin-report-item .info .photo-link {
            font-size: 12px;
            margin-top: 4px;
        }
        .admin-report-item .info .photo-link a {
            color: #1a73e8;
            text-decoration: none;
        }
        .admin-report-item .info .photo-link a:hover {
            text-decoration: underline;
        }

        /* ===== EMERGENCY STYLES ===== */
        .emergency-report {
            background: #fce4ec !important;
            border-left: 6px solid #ea4335 !important;
            animation: pulseRed 1.5s infinite;
        }
        @keyframes pulseRed {
            0%,
            100% {
                background-color: #fce4ec;
            }
            50% {
                background-color: #ffcdd2;
            }
        }
        .emergency-badge {
            background: #ea4335;
            color: #fff;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.3;
            }
        }

        /* ===== STATUS BADGE ===== */
        .status-badge {
            display: inline-block;
            padding: 3px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
        }
        .status-submitted {
            background: #e3f2fd;
            color: #0d47a1;
        }
        .status-reviewing {
            background: #fff3e0;
            color: #e65100;
        }
        .status-progress {
            background: #fce4ec;
            color: #b71c1c;
        }
        .status-resolved {
            background: #e8f5e9;
            color: #1b5e20;
        }
        .status-rejected {
            background: #fafafa;
            color: #616161;
        }

        /* ===== PRIORITY BADGE ===== */
        .priority-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .priority-low {
            background: #e8f5e9;
            color: #34a853;
        }
        .priority-medium {
            background: #fff8e1;
            color: #fbbc04;
        }
        .priority-high {
            background: #fff3e0;
            color: #ff6b00;
        }
        .priority-critical {
            background: #fce4ec;
            color: #ea4335;
            animation: pulseCritical 1.5s infinite;
        }
        @keyframes pulseCritical {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.04);
            }
        }

        /* ===== COMMUNITY STATS ===== */
        .community-stats {
            display: flex;
            gap: 18px;
            font-size: 13px;
            color: #5f6b7a;
            margin-top: 4px;
            flex-wrap: wrap;
        }
        .stat-item {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .stat-item i {
            font-size: 14px;
        }
        .stat-item .count {
            font-weight: 600;
            color: #1a1a2e;
        }

        /* ===== ACTIONS ===== */
        .admin-report-item .actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-start;
        }
        .admin-report-item .actions select {
            padding: 6px 12px;
            border-radius: 8px;
            border: 2px solid #e0e4ea;
            font-size: 13px;
            background: #fff;
            cursor: pointer;
            transition: border 0.2s;
            color: #333;
            font-family: inherit;
        }
        .admin-report-item .actions select:focus {
            outline: none;
            border-color: #1a73e8;
        }
        .admin-report-item .actions .btn-sm {
            padding: 6px 10px;
            font-size: 13px;
            min-width: 36px;
        }

        /* ===== MINI MAP ===== */
        .mini-map {
            width: 100%;
            height: 150px;
            border-radius: 8px;
            overflow: hidden;
            background: #f8f9fc;
            border: 1px solid #e8ecf2;
        }
        .mini-map .map-loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 13px;
            color: #888;
        }

        /* ===== EMPTY / LOADING / ERROR ===== */
        .empty-state,
        .loading-state,
        .error-state {
            text-align: center;
            padding: 50px 20px;
            color: #888;
        }
        .empty-state i,
        .error-state i {
            font-size: 56px;
            color: #ddd;
            display: block;
            margin-bottom: 14px;
        }
        .empty-state h3 {
            color: #555;
            margin-bottom: 4px;
            font-size: 18px;
        }
        .empty-state p {
            font-size: 14px;
        }
        .error-state {
            color: #ea4335;
        }
        .error-state i {
            color: #ea4335;
        }
        .error-state .btn {
            margin-top: 12px;
        }
        .loading-state i {
            font-size: 36px;
            color: #1a73e8;
            display: block;
            margin-bottom: 14px;
        }
        .loading-state p {
            font-size: 15px;
            color: #888;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 420px;
            width: 90%;
            background: #1a1a2e;
            color: #fff;
            padding: 14px 22px;
            border-radius: 14px;
            text-align: center;
            font-weight: 500;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.35s ease, transform 0.35s ease;
            pointer-events: none;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            background: #1b5e20;
        }
        .toast.error {
            background: #b71c1c;
        }
        .toast.info {
            background: #0d47a1;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .admin-container {
                padding: 0 14px 30px;
            }
            .admin-header {
                padding: 14px 16px;
                margin: 0 -14px 16px;
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .admin-header .logo {
                font-size: 18px;
            }
            .header-right {
                justify-content: space-between;
            }
            .admin-stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .admin-stat .num {
                font-size: 24px;
            }
            .admin-actions {
                flex-direction: column;
            }
            .admin-actions .btn {
                width: 100%;
                justify-content: center;
            }
            .admin-actions .search-box {
                min-width: 100%;
            }
            .filters-row {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .filters-row .label {
                margin-right: 0;
            }
            .filter-priority-btn {
                padding: 5px 12px;
                font-size: 11px;
            }
            .admin-report-item {
                flex-direction: column;
                align-items: stretch;
                padding: 14px;
            }
            .admin-report-item .actions {
                justify-content: flex-start;
                padding-top: 10px;
                border-top: 1px solid #f0f2f5;
            }
            .admin-report-item .actions select {
                flex: 1;
                min-width: 100px;
            }
            .sort-select {
                width: 100%;
            }
        }
        @media (max-width: 480px) {
            .admin-stats {
                grid-template-columns: repeat(2, 1fr);
                gap: 8px;
            }
            .admin-stat {
                padding: 12px 8px;
            }
            .admin-stat .num {
                font-size: 20px;
            }
            .admin-stat .lbl {
                font-size: 10px;
            }
            .admin-report-item .info .title {
                font-size: 14px;
            }
            .toast {
                font-size: 14px;
                padding: 12px 16px;
                bottom: 80px;
            }

            .sort-toolbar {
                display: flex;
                gap: 12px;
                align-items: center;
                flex-wrap: wrap;
                margin-bottom: 16px;
            }

            .sort-label {
                font-size: 13px;
                font-weight: 600;
                color: #5f6b7a;
            }
            
        }
        /* ===== SIMPLE BACKGROUND – CLEAR PHOTO ===== */
body {
    background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTf9wMS1VZNluak-Y2e9pHdYvTevRfEHYj4CJi7tdvIgQ&s=10') no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
    font-family: 'Inter', system-ui, sans-serif;
}

/* No overlay */

.admin-container {
    max-width: 1100px;
    margin: 20px auto;
    background: rgba(255, 255, 255, 0.8);
    -webkit-backdrop-filter: blur(2px);
    backdrop-filter: blur(2px);
}

.admin-header {
    background: rgba(255, 255, 255, 0.9) !important;
    border-radius: 16px !important;
    margin: 16px -16px 20px !important;
    padding: 18px 24px !important;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    color: #1a1a2e !important;
}

.admin-stat,
.admin-report-item {
    background: rgba(255, 255, 255, 0.7) !important;
    border: 1px solid rgba(255, 255, 255, 0.3) !important;
    color: #1a1a2e !important;
}

.admin-stat .num,
.admin-stat .lbl,
.admin-report-item .info .title,
.admin-report-item .info .loc,
.admin-report-item .info .meta,
.admin-report-item .info .desc {
    color: #1a1a2e !important;
}

.admin-report-item .info .desc {
    background: rgba(255, 255, 255, 0.5) !important;
}

.admin-report-item .actions select {
    background: #fff !important;
    color: #1a1a2e !important;
    border-color: #ddd !important;
}

/* Dark theme */
body.dark-theme .admin-container {
    background: rgba(0, 0, 0, 0.7) !important;
}
body.dark-theme .admin-header {
    background: rgba(0, 0, 0, 0.5) !important;
    color: #fff !important;
}
body.dark-theme .admin-stat,
body.dark-theme .admin-report-item {
    background: rgba(255, 255, 255, 0.05) !important;
    color: #fff !important;
}
body.dark-theme .admin-stat .num,
body.dark-theme .admin-stat .lbl,
body.dark-theme .admin-report-item .info .title,
body.dark-theme .admin-report-item .info .loc,
body.dark-theme .admin-report-item .info .meta,
body.dark-theme .admin-report-item .info .desc {
    color: #fff !important;
}
    </style>
</head>
<body>

    <div id="toast" class="toast"></div>

    <div class="admin-container">

        <header class="admin-header">
            <div class="logo">
                <i class="fas fa-road"></i>
                <span>FixMyBlock</span>
                <span class="subtitle">Admin</span>
            </div>
            <div class="header-right">
                <span class="badge">● LIVE</span>
                <button class="btn btn-outline btn-sm" onclick="refreshReports()">
                    <i class="fas fa-sync"></i> Refresh
                </button>
                <button class="btn btn-danger btn-sm" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </header>

        <div class="admin-body">

            <div class="admin-stats" id="adminStats">
                <div class="admin-stat">
                    <div class="num total" id="adminTotal">0</div>
                    <div class="lbl">Total Reports</div>
                </div>
                <div class="admin-stat">
                    <div class="num submitted" id="adminSubmitted">0</div>
                    <div class="lbl">Submitted</div>
                </div>
                <div class="admin-stat">
                    <div class="num progress" id="adminProgress">0</div>
                    <div class="lbl">In Progress</div>
                </div>
                <div class="admin-stat">
                    <div class="num resolved" id="adminResolved">0</div>
                    <div class="lbl">Resolved</div>
                </div>
                <div class="admin-stat">
                    <div class="num emergency" id="adminEmergency">0</div>
                    <div class="lbl">🚨 Emergency</div>
                </div>
            </div>

            <div class="admin-actions">
                <button class="btn btn-success btn-sm" onclick="exportExcel()">
                    <i class="fas fa-file-excel"></i> Export Excel
                </button>
                <button class="btn btn-danger btn-sm" onclick="clearAllReports()">
                    <i class="fas fa-trash"></i> Clear All
                </button>
                <div class="search-box">
                    <input type="text" id="adminSearch" placeholder="🔍 Search reports..." oninput="applyFiltersAndSort()" />
                </div>
            </div>

            <div class="filters-row">
                <span class="label">Priority:</span>
                <button class="filter-priority-btn active" onclick="filterByPriority('all')">All</button>
                <button class="filter-priority-btn priority-low" onclick="filterByPriority('LOW')">🟢 Low</button>
                <button class="filter-priority-btn priority-medium" onclick="filterByPriority('MEDIUM')">🟡 Medium</button>
                <button class="filter-priority-btn priority-high" onclick="filterByPriority('HIGH')">🟠 High</button>
                <button class="filter-priority-btn priority-critical" onclick="filterByPriority('CRITICAL')">🔴 Critical</button>
            </div>

            <div class="sort-toolbar">
                <label for="sortSelect" class="sort-label">Sort by:</label>
                <select id="sortSelect" class="sort-select" title="Sort reports" onchange="sortReports(this.value)">
                    <option value="newest">Newest</option>
                    <option value="oldest">Oldest</option>
                    <option value="supported">Most Supported</option>
                    <option value="priority">Highest Priority</option>
                </select>
            </div>

            <div id="adminReportList">
                <div class="loading-state">
                    <i class="fas fa-spinner fa-spin"></i>
                    <p>Loading reports...</p>
                </div>
            </div>

        </div>
    </div>

    <script type="module">
        // ================================================================
        // 🔴🔴🔴 PASTE YOUR FIREBASE CONFIG HERE
        // ================================================================

        const firebaseConfig = {
            apiKey: "AIzaSyBVvWlYUCOfALhtWdR53_ZcP5spTYhDyu8",
  authDomain: "fixmyblock-nepal.firebaseapp.com",
  projectId: "fixmyblock-nepal",
  storageBucket: "fixmyblock-nepal.firebasestorage.app",
  messagingSenderId: "742804276117",
  appId: "1:742804276117:web:ddab9eeff9a357c1112c9c",
  measurementId: "G-C3RQER0PC1"
        };

        // ================================================================
        // 🔴🔴🔴 DO NOT CHANGE ANYTHING BELOW THIS LINE
        // ================================================================

        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import {
            getAuth,
            onAuthStateChanged,
            signOut
        } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
        import {
            getFirestore,
            collection,
            query,
            orderBy,
            getDocs,
            doc,
            getDoc,
            updateDoc,
            deleteDoc,
            onSnapshot,
            where,
            writeBatch,
            serverTimestamp,
            addDoc
        } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
        import { getFunctions, httpsCallable } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-functions.js';

        // ================================================================
        //  INIT FIREBASE
        // ================================================================

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const functions = getFunctions(app);

        console.log('✅ Firebase Admin initialized!');

        // ================================================================
        //  HELPERS
        // ================================================================

        const CATEGORIES = {
            pothole: { label: 'Pothole', icon: 'fa-circle-exclamation' },
            streetlight: { label: 'Streetlight', icon: 'fa-lightbulb' },
            drainage: { label: 'Drainage', icon: 'fa-water' },
            garbage: { label: 'Garbage', icon: 'fa-trash' },
            landslide: { label: 'Landslide', icon: 'fa-mountain' }
        };

        const STATUSES = {
            submitted: { label: 'Submitted', class: 'status-submitted' },
            reviewing: { label: 'Under Review', class: 'status-reviewing' },
            in_progress: { label: 'In Progress', class: 'status-progress' },
            resolved: { label: 'Resolved', class: 'status-resolved' },
            rejected: { label: 'Rejected', class: 'status-rejected' }
        };

        const PRIORITY_ICONS = {
            LOW: 'fa-arrow-down',
            MEDIUM: 'fa-minus',
            HIGH: 'fa-arrow-up',
            CRITICAL: 'fa-exclamation-triangle'
        };

        const PRIORITY_ORDER = { CRITICAL: 0, HIGH: 1, MEDIUM: 2, LOW: 3 };

        function getCategoryLabel(cat) { return CATEGORIES[cat]?.label || cat; }

        function getCategoryIcon(cat) { return CATEGORIES[cat]?.icon || 'fa-question'; }

        function getStatusLabel(status) { return STATUSES[status]?.label || status; }

        function getStatusClass(status) { return STATUSES[status]?.class || ''; }

        function formatTimestamp(ts) {
            if (!ts) return 'Recently';
            try {
                const diff = Date.now() - ts.toMillis();
                if (diff < 60000) return 'Just now';
                if (diff < 3600000) return Math.floor(diff / 60000) + ' min ago';
                if (diff < 86400000) return Math.floor(diff / 3600000) + ' hours ago';
                return Math.floor(diff / 86400000) + ' days ago';
            } catch { return 'Recently'; }
        }

        let allReports = [];
        let filteredReports = [];
        let currentPriorityFilter = 'all';
        let currentSort = 'newest';
        let selectedReports = [];

        function showToast(msg, type = '') {
            const el = document.getElementById('toast');
            if (!el) return;
            el.textContent = msg;
            el.className = 'toast ' + type;
            void el.offsetWidth;
            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 3500);
        }

        // ================================================================
        //  AUTH GUARD + LOGIN ALERT
        // ================================================================

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            try {
                const adminDoc = await getDoc(doc(db, 'admins', user.uid));
                if (!adminDoc.exists() || adminDoc.data().role !== 'admin') {
                    await signOut(auth);
                    window.location.href = 'login.html';
                    return;
                }
                console.log('✅ Admin verified! Loading reports...');
                if (window._listenerUnsubscribe) window._listenerUnsubscribe();
                listenToReports();
                loadAdminLogs();

                // ===== SEND LOGIN ALERT EMAIL (once per session) =====
                if (!window._loginAlertSent) {
                    window._loginAlertSent = true;
                    const sendLoginAlert = httpsCallable(functions, 'sendLoginAlert');
                    const email = user.email;
                    const displayName = user.displayName || '';
                    const timestamp = Date.now();
                    fetch('https://api.ipify.org?format=json')
                        .then(res => res.json())
                        .then(data => {
                            const ip = data.ip;
                            sendLoginAlert({
                                email,
                                displayName,
                                timestamp,
                                ip,
                                userAgent: navigator.userAgent
                            }).catch(err => console.error('Login alert failed:', err));
                        })
                        .catch(err => console.error('IP fetch failed:', err));
                }

            } catch (error) {
                console.error('Error checking admin:', error);
                document.getElementById('adminReportList').innerHTML = `
                        <div class="error-state">
                            <i class="fas fa-exclamation-circle"></i>
                            <h3>Error checking admin status</h3>
                            <p>${error.message}</p>
                            <button onclick="location.reload()" class="btn btn-primary btn-sm" style="margin-top:12px;">Retry</button>
                        </div>
                    `;
            }
        });

        window.logout = async function() {
            await signOut(auth);
            window.location.href = 'login.html';
        };

        async function logAdminAction(action, reportId = null, details = {}) {
            try {
                const user = auth.currentUser;
                await addDoc(collection(db, 'admin_logs'), {
                    action,
                    reportId,
                    adminId: user?.uid || 'unknown',
                    adminEmail: user?.email || 'unknown',
                    details,
                    timestamp: serverTimestamp()
                });
            } catch (error) {
                console.error('Error logging admin action:', error);
            }
        }

        // ================================================================
        //  LISTEN TO REPORTS
        // ================================================================

        function listenToReports() {
            const q = query(collection(db, 'reports'), orderBy('createdAt', 'desc'));

            const unsubscribe = onSnapshot(q, (snapshot) => {
                console.log('✅ Admin Snapshot size:', snapshot.size);
                allReports = [];
                snapshot.forEach((doc) => {
                    allReports.push({ id: doc.id, ...doc.data() });
                });
                applyFiltersAndSort();
                updateStats();
            }, (error) => {
                console.error('Listener error:', error);
                document.getElementById('adminReportList').innerHTML = `
                        <div class="error-state">
                            <i class="fas fa-exclamation-circle"></i>
                            <h3>Error Loading Reports</h3>
                            <p>${error.message}</p>
                            <button onclick="location.reload()" class="btn btn-primary btn-sm" style="margin-top:12px;">Retry</button>
                        </div>
                    `;
            });

            window._listenerUnsubscribe = unsubscribe;
        }

        async function loadAdminLogs() {
            try {
                const q = query(collection(db, 'admin_logs'), orderBy('timestamp', 'desc'), limit(50));
                const snapshot = await getDocs(q);
                const logs = [];
                snapshot.forEach((doc) => {
                    logs.push({ id: doc.id, ...doc.data() });
                });
                renderAdminLogs(logs);
            } catch (error) {
                console.error('Error loading logs:', error);
            }
        }

        function renderAdminLogs(logs) {
            const container = document.getElementById('adminLogs');
            if (!container) return;
            if (logs.length === 0) {
                container.innerHTML = '<div class="text-muted" style="padding:12px;text-align:center;">No activity logs yet</div>';
                return;
            }
            container.innerHTML = logs.map(log => `
                    <div style="padding:6px 0;border-bottom:1px solid #f0f2f5;font-size:13px;">
                        <strong>${log.action}</strong>
                        ${log.reportId ? ` on #${log.reportId.substring(0,8)}` : ''}
                        <span style="color:#888;font-size:12px;"> ${log.adminEmail || 'Unknown'}</span>
                        <span style="color:#aaa;font-size:11px;float:right;">${formatTimestamp(log.timestamp)}</span>
                    </div>
                `).join('');
        }

        // ================================================================
        //  FILTERS & SORTING
        // ================================================================

        window.filterByPriority = function(priority) {
            currentPriorityFilter = priority;
            document.querySelectorAll('.filter-priority-btn').forEach(btn => btn.classList.remove('active'));
            if (priority === 'all') {
                document.querySelector('.filter-priority-btn')?.classList.add('active');
            } else {
                const btn = document.querySelector(`.filter-priority-btn.priority-${priority.toLowerCase()}`);
                if (btn) btn.classList.add('active');
            }
            applyFiltersAndSort();
        };

        window.sortReports = function(sort) {
            currentSort = sort;
            applyFiltersAndSort();
        };

        window.applyFiltersAndSort = function() {
            const search = document.getElementById('adminSearch')?.value.toLowerCase().trim() || '';

            let filtered = allReports;
            if (currentPriorityFilter !== 'all') {
                filtered = filtered.filter(r => (r.priority || 'LOW') === currentPriorityFilter);
            }

            if (search) {
                filtered = filtered.filter(r =>
                    (r.location || '').toLowerCase().includes(search) ||
                    (r.description || '').toLowerCase().includes(search) ||
                    (r.category || '').toLowerCase().includes(search) ||
                    (r.submittedBy || '').toLowerCase().includes(search) ||
                    r.id.toLowerCase().includes(search)
                );
            }

            switch (currentSort) {
                case 'priority':
                    filtered.sort((a, b) =>
                        (PRIORITY_ORDER[a.priority || 'LOW'] || 4) - (PRIORITY_ORDER[b.priority || 'LOW'] || 4)
                    );
                    break;
                case 'supported':
                    filtered.sort((a, b) => (b.affectedCount || 0) - (a.affectedCount || 0));
                    break;
                case 'oldest':
                    filtered.sort((a, b) => (a.createdAt?.toMillis() || 0) - (b.createdAt?.toMillis() || 0));
                    break;
                case 'newest':
                default:
                    filtered.sort((a, b) => (b.createdAt?.toMillis() || 0) - (a.createdAt?.toMillis() || 0));
                    break;
            }

            filteredReports = filtered;
            renderAdminReports();
        };

        // ================================================================
        //  BULK SELECT
        // ================================================================

        window.toggleSelectReport = function(reportId) {
            const index = selectedReports.indexOf(reportId);
            if (index > -1) {
                selectedReports.splice(index, 1);
            } else {
                selectedReports.push(reportId);
            }
            updateBulkActions();
        };

        function updateBulkActions() {
            const container = document.getElementById('bulkActions');
            if (!container) return;
            if (selectedReports.length === 0) {
                container.style.display = 'none';
                return;
            }
            container.style.display = 'flex';
            document.getElementById('bulkCount').textContent = selectedReports.length;
        }

        window.bulkUpdateStatus = async function(newStatus) {
            if (selectedReports.length === 0) return;
            if (!confirm(`Update ${selectedReports.length} reports to "${getStatusLabel(newStatus)}"?`)) return;

            try {
                const batch = writeBatch(db);
                for (const id of selectedReports) {
                    const ref = doc(db, 'reports', id);
                    batch.update(ref, {
                        status: newStatus,
                        updatedAt: new Date().toISOString()
                    });
                }
                await batch.commit();
                showToast(`✅ Updated ${selectedReports.length} reports to "${getStatusLabel(newStatus)}"`, 'success');
                selectedReports = [];
                updateBulkActions();
            } catch (error) {
                console.error('Bulk update error:', error);
                showToast('❌ Error updating reports: ' + error.message, 'error');
            }
        };

        // ================================================================
        //  RENDER ADMIN REPORTS (EMERGENCY HIGHLIGHTING)
        // ================================================================

        function renderAdminReports() {
            const container = document.getElementById('adminReportList');

            if (filteredReports.length === 0) {
                container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <h3>No reports found</h3>
                            <p>${allReports.length === 0 ? 'No reports submitted yet.' : 'Try adjusting your search or filters.'}</p>
                        </div>
                    `;
                return;
            }

            // Import initStaticMap dynamically here since it's used
            // We'll call it after rendering

            container.innerHTML = filteredReports.map(r => {
                const priority = r.priority || 'LOW';
                const priorityClass = priority.toLowerCase();
                const priorityIcon = PRIORITY_ICONS[priority] || 'fa-circle';
                const affected = r.affectedCount || 0;
                const supporters = (r.supportedBy || []).length;
                const isSelected = selectedReports.includes(r.id);
                const isEmergency = r.isEmergency || false;
                const cardClass = isEmergency ? 'admin-report-item emergency-report' : 'admin-report-item';

                // Photo gallery
                const photoHtml = r.photoUrls && r.photoUrls.length > 0 ?
                    `<div style="display:grid;grid-template-columns:repeat(${Math.min(r.photoUrls.length, 3)},1fr);gap:4px;margin-top:4px;max-width:200px;">
                            ${r.photoUrls.map(url => `<a href="${url}" target="_blank" style="display:block;"><img src="${url}" alt="Photo" style="width:100%;height:60px;object-fit:cover;border-radius:6px;border:1px solid #e8ecf2;" /></a>`).join('')}
                        </div>` :
                    '<div style="color:#888;font-size:12px;margin-top:4px;">No photos</div>';

                return `
                        <div class="${cardClass}" style="${isSelected ? 'border-color:#1a73e8;background:#e8f0fe;' : ''}">
                            <div style="display:flex;align-items:center;gap:12px;width:100%;flex-wrap:wrap;">
                                <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelectReport('${r.id}')" style="width:18px;height:18px;cursor:pointer;" />
                                <div class="info" style="flex:1;min-width:200px;">
                                    <div class="title">
                                        <span class="report-id">#${r.id.substring(0, 8)}</span>
                                        <i class="fas ${getCategoryIcon(r.category)} category-icon" style="color:#1a73e8;"></i>
                                        ${getCategoryLabel(r.category)}
                                        ${isEmergency ? '<span class="emergency-badge">🚨 EMERGENCY</span>' : ''}
                                        <span class="priority-badge priority-${priorityClass}">
                                            <i class="fas ${priorityIcon}"></i> ${priority}
                                        </span>
                                    </div>
                                    <div class="loc"><i class="fas fa-location-dot"></i> ${r.location || 'Unknown'}</div>
                                    <div class="meta">
                                        ${formatTimestamp(r.createdAt)} ·
                                        ${r.submittedBy || 'Anonymous'} ·
                                        ${r.latitude ? `${r.latitude.toFixed(4)}, ${r.longitude?.toFixed(4) || ''}` : ''}
                                    </div>
                                    <div class="community-stats">
                                        <span class="stat-item"><i class="fas fa-users"></i> <span class="count">${affected}</span> affected</span>
                                        <span class="stat-item"><i class="fas fa-hand-peace"></i> <span class="count">${supporters}</span> supporters</span>
                                        ${r.rating > 0 ? `<span class="stat-item"><i class="fas fa-star" style="color:#fbbc04;"></i> ${r.rating.toFixed(1)}</span>` : ''}
                                    </div>
                                    ${r.description ? `<div class="desc">📝 ${r.description}</div>` : ''}
                                    <div style="margin-top:6px;">
                                        <strong>Photos:</strong>
                                        ${photoHtml}
                                    </div>
                                    <div style="margin-top:6px;">
                                        <div class="mini-map" id="map-${r.id}"></div>
                                    </div>
                                </div>
                                <div class="actions">
                                    <span class="status-badge ${getStatusClass(r.status || 'submitted')}">${getStatusLabel(r.status || 'submitted')}</span>
                                    <select onchange="updateStatus('${r.id}', this.value)">
                                        <option value="submitted" ${(r.status || 'submitted') === 'submitted' ? 'selected' : ''}>Submitted</option>
                                        <option value="reviewing" ${(r.status || 'submitted') === 'reviewing' ? 'selected' : ''}>Under Review</option>
                                        <option value="in_progress" ${(r.status || 'submitted') === 'in_progress' ? 'selected' : ''}>In Progress</option>
                                        <option value="resolved" ${(r.status || 'submitted') === 'resolved' ? 'selected' : ''}>Resolved</option>
                                        <option value="rejected" ${(r.status || 'submitted') === 'rejected' ? 'selected' : ''}>Rejected</option>
                                    </select>
                                    <button class="btn btn-danger btn-sm" onclick="deleteReport('${r.id}')">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
            }).join('');

            // Initialize maps – import initStaticMap from map-utils
            // We need to dynamically import because it's a module
            import('./js/map-utils.js').then(({ initStaticMap }) => {
                filteredReports.forEach(r => {
                    if (r.latitude && r.longitude) {
                        const mapId = `map-${r.id}`;
                        const container = document.getElementById(mapId);
                        if (container) {
                            initStaticMap(mapId, r.latitude, r.longitude, `<b>${getCategoryLabel(r.category)}</b><br>${r.location}`);
                        }
                    }
                });
            });

            updateBulkActions();
        }

        // ================================================================
        //  UPDATE STATS
        // ================================================================

        function updateStats() {
            const total = allReports.length;
            const submitted = allReports.filter(r => r.status === 'submitted').length;
            const progress = allReports.filter(r => r.status === 'reviewing' || r.status === 'in_progress').length;
            const resolved = allReports.filter(r => r.status === 'resolved').length;
            const emergency = allReports.filter(r => r.isEmergency).length;

            document.getElementById('adminTotal').textContent = total;
            document.getElementById('adminSubmitted').textContent = submitted;
            document.getElementById('adminProgress').textContent = progress;
            document.getElementById('adminResolved').textContent = resolved;
            document.getElementById('adminEmergency').textContent = emergency;
        }

        // ================================================================
        //  UPDATE STATUS
        // ================================================================

        window.updateStatus = async function(reportId, newStatus) {
            try {
                await updateDoc(doc(db, 'reports', reportId), {
                    status: newStatus,
                    updatedAt: new Date().toISOString()
                });
                await logAdminAction('status_update', reportId, { newStatus });
                showToast(`✅ Report updated to "${getStatusLabel(newStatus)}"`, 'success');
            } catch (error) {
                showToast('❌ Error updating status: ' + error.message, 'error');
            }
        };

        // ================================================================
        //  DELETE REPORT
        // ================================================================

        window.deleteReport = async function(reportId) {
            if (!confirm('Are you sure? This cannot be undone.')) return;
            try {
                await deleteDoc(doc(db, 'reports', reportId));
                await logAdminAction('delete', reportId);
                showToast('🗑️ Report deleted', 'info');
                applyFiltersAndSort();
            } catch (error) {
                showToast('❌ Error deleting report: ' + error.message, 'error');
            }
        };

        // ================================================================
        //  REFRESH
        // ================================================================

        window.refreshReports = function() {
            showToast('🔄 Refreshing...', 'info');
            applyFiltersAndSort();
            loadAdminLogs();
        };

        // ================================================================
        //  EXPORT EXCEL
        // ================================================================

        window.exportExcel = function() {
            if (allReports.length === 0) {
                showToast('📭 No reports to export', 'error');
                return;
            }

            const headers = ['ID', 'Category', 'Description', 'Location', 'Latitude', 'Longitude', 'Photo URLs', 'Status',
                'Priority', 'Affected Count', 'Supporters', 'Emergency', 'Rating', 'Submitted By', 'Date'
            ];

            const rows = allReports.map(r => [
                r.id || '',
                getCategoryLabel(r.category) || '',
                (r.description || '').replace(/,/g, ';'),
                (r.location || '').replace(/,/g, ';'),
                r.latitude || '',
                r.longitude || '',
                (r.photoUrls || []).join('; '),
                getStatusLabel(r.status || 'submitted'),
                r.priority || 'LOW',
                r.affectedCount || 0,
                (r.supportedBy || []).length,
                r.isEmergency ? 'YES' : 'NO',
                r.rating || 0,
                r.submittedBy || 'Anonymous',
                r.createdAt ? new Date(r.createdAt.toMillis()).toLocaleString() : ''
            ]);

            let csv = headers.join(',') + '\n';
            rows.forEach(row => csv += row.join(',') + '\n');

            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `FixMyBlock_Reports_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('📊 Excel file downloaded!', 'success');
        };

        // ================================================================
        //  CLEAR ALL REPORTS
        // ================================================================

        window.clearAllReports = async function() {
            if (!confirm('Delete ALL reports? This cannot be undone!')) return;
            try {
                const q = query(collection(db, 'reports'));
                const snapshot = await getDocs(q);
                const batch = writeBatch(db);
                let count = 0;
                for (const doc of snapshot.docs) {
                    batch.delete(doc.ref);
                    count++;
                }
                await batch.commit();
                await logAdminAction('clear_all');
                showToast(`🗑️ Deleted ${count} reports`, 'info');
            } catch (error) {
                showToast('❌ Error clearing reports: ' + error.message, 'error');
            }
        };

        // ================================================================
        //  EXPOSE FUNCTIONS
        // ================================================================

        window.filterByPriority = filterByPriority;
        window.sortReports = sortReports;
        window.applyFiltersAndSort = applyFiltersAndSort;
        window.updateStatus = updateStatus;
        window.deleteReport = deleteReport;
        window.refreshReports = refreshReports;
        window.exportExcel = exportExcel;
        window.clearAllReports = clearAllReports;
        window.logout = logout;
        window.toggleSelectReport = toggleSelectReport;
        window.bulkUpdateStatus = bulkUpdateStatus;

        console.log('👑 FixMyBlock Nepal - Admin Dashboard with Emergency Highlighting & Login Alert Loaded');
    </script>

</body>
</html>
